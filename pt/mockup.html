<title>짐코치 시안</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<style>
/* 레이아웃: 폰 한 화면 폭(최대 440px) 세로 앱. 오늘·기록·내 정보는 하단 탭, 운동 중·휴식·완료는 전체 화면(탭·광고 숨김). */
:root{
  --bg:#121417; --surface:#1b1e23; --surface-2:#262a31; --line:#30353d;
  --fg:#eef0f3; --muted:#9aa1ac; --faint:#6b727d;
  --accent:#ff8a3d; --accent-ink:#1f1006; --accent-soft:rgba(255,138,61,.14);
  --good:#4cc38a; --warn:#e8b341; --bad:#e5534b; --info:#6aa9ff;
  --skin:#3c434e; --fig:#d3d8df; --fig-far:#858d99; --eq:#454c57; --eq-2:#5a626e;
  --f-text:'IBM Plex Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-num:'Barlow Semi Condensed','IBM Plex Sans KR',system-ui,sans-serif;
  --r:14px;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-text);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
.app{max-width:440px;margin:0 auto;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 150px}
.app.full{padding-bottom:32px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:12px;color:var(--muted);letter-spacing:.06em}
h1{font-size:22px;line-height:1.3;margin:0;font-weight:700;text-wrap:balance}
h2{font-size:17px;margin:0;font-weight:700}
h3{font-size:15px;margin:0;font-weight:600}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:8px}
.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.card{background:var(--surface);border-radius:var(--r);padding:16px}
.tag{font-size:12px;padding:3px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.tag.acc{background:var(--accent-soft);color:var(--accent)}
.tag.edit{background:rgba(106,169,255,.14);color:var(--info)}
.sample{font-size:11px;color:var(--faint);border:1px dashed var(--line);border-radius:6px;padding:1px 6px;white-space:nowrap}
.link{color:var(--accent);font-size:14px;font-weight:600;padding:4px 0}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.day{padding:6px 0 8px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
.day .d{font-size:12px;color:var(--muted)}
.day .n{font-family:var(--f-num);font-size:18px;font-weight:600}
.day .m{font-size:10px;height:14px;color:var(--faint);white-space:nowrap}
.day.today{background:var(--surface-2)}
.day.today .m{color:var(--accent)}
.day.done .m{color:var(--good)}

.bodies{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:center}
.bodies svg{width:100%;height:auto;max-height:170px}
.legend{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.rec-list{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.rec-item{background:var(--surface-2);border-radius:10px;padding:6px 4px;text-align:center;font-size:12px}
.rec-item b{display:block;font-family:var(--f-num);font-size:16px}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.seg button{padding:8px 4px;border-radius:9px;font-size:14px;color:var(--muted);display:flex;flex-direction:column;align-items:center;line-height:1.25}
.seg button small{font-size:11px;color:var(--faint)}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--fg);font-weight:600}
.seg button[aria-pressed="true"] small{color:var(--accent)}
.cond{display:grid;grid-template-columns:64px 1fr;align-items:center;gap:6px 10px}
.cond .lab{font-size:13px;color:var(--muted)}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.scale button{height:32px;border-radius:8px;background:var(--surface-2);font-family:var(--f-num);font-size:15px;color:var(--muted)}
.scale button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.intensity{display:flex;align-items:baseline;gap:8px}
.intensity .big{font-family:var(--f-num);font-size:34px;font-weight:700;line-height:1}

.ex-list{display:flex;flex-direction:column}
.ex{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.ex:first-child{border-top:0}
.thumb{width:48px;height:48px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;color:var(--muted);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.ex-name{font-weight:600}
.ex-meta{font-size:13px;color:var(--muted)}
.ex-note{font-size:12px;color:var(--warn);margin-top:2px}
.ex .go{color:var(--faint);font-size:13px}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px;border-radius:14px;font-weight:700;font-size:16px}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.sec{background:var(--surface-2)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--muted);font-weight:500;padding:12px}
.btn.sm{padding:10px;font-size:14px;border-radius:10px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* 프로그램 편집 */
.pitem{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.pitem:first-child{border-top:0}
.order{display:flex;flex-direction:column;gap:4px}
.order button{width:28px;height:26px;border-radius:7px;background:var(--surface-2);color:var(--muted);font-size:12px}
.pctl{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.stepper{display:inline-flex;align-items:center;background:var(--surface-2);border-radius:9px}
.stepper button{width:32px;height:32px;font-size:18px;font-family:var(--f-num)}
.stepper span{min-width:52px;text-align:center;font-size:13px}
.mini{padding:7px 10px;border-radius:9px;background:var(--surface-2);font-size:13px}
.mini.danger{color:var(--bad)}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs{max-width:440px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tabs button{padding:10px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--faint)}
.tabs button[aria-current="page"]{color:var(--fg)}
.tabs button[aria-current="page"] svg{color:var(--accent)}
.ad{max-width:440px;margin:0 auto;text-align:center;font-size:12px;color:var(--faint);padding:6px 16px 8px;border-top:1px dashed var(--line)}
.ad b{font-weight:500;color:var(--muted);margin-right:6px}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 0 8px}
.pill{padding:8px 12px;border-radius:99px;background:var(--surface-2);font-size:13px;display:inline-flex;gap:6px;align-items:center}
.pill[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.progress{height:4px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.figbox{aspect-ratio:5/4;max-width:100%;border-radius:14px;background:radial-gradient(120% 90% at 50% 35%,var(--surface-2),var(--surface) 75%);overflow:hidden;position:relative}
.figbox svg{width:100%;height:100%;display:block}
.figcap{position:absolute;left:10px;bottom:8px;font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.figcap i{width:9px;height:9px;border-radius:3px;background:var(--accent);display:inline-block}
.thumb svg{width:100%;height:100%}
.photo{aspect-ratio:4/3;max-width:100%;border:1.5px dashed var(--line);border-radius:12px;display:grid;place-items:center;text-align:center;color:var(--faint);font-size:13px;background:var(--surface-2);overflow:hidden}
.photo.has{border:0}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.memo{font-size:13px;background:var(--surface-2);border-radius:10px;padding:8px 12px;display:flex;gap:8px;align-items:center;width:100%;text-align:left}
.memo b{color:var(--accent);font-weight:600;white-space:nowrap}
.sets{display:flex;flex-direction:column;gap:6px}
.set{display:grid;grid-template-columns:64px 1fr 56px;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;font-size:14px;color:var(--muted)}
.set .num{font-size:17px;color:var(--fg)}
.set.cur{background:var(--accent-soft);color:var(--fg)}
.set.done{opacity:.55}
.set .st{text-align:right;font-size:12px}
.set.done .st{color:var(--good)}
.dial{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dial>div{background:var(--surface-2);border-radius:14px;padding:10px 8px;text-align:center}
.dial .v{font-family:var(--f-num);font-size:44px;font-weight:700;line-height:1.05}
.dial .u{font-size:13px;color:var(--muted)}
.dial .pm{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.dial .pm button{height:40px;border-radius:10px;background:var(--bg);font-size:20px;font-family:var(--f-num)}
.feel{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.feel button{padding:14px 4px;border-radius:12px;background:var(--surface-2);font-weight:600}
.feel button small{display:block;font-weight:400;font-size:11px;color:var(--muted)}

.rest{display:flex;flex-direction:column;align-items:center;gap:20px;padding-top:24px;text-align:center}
.ring{position:relative;width:240px;max-width:100%;aspect-ratio:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;align-content:center}
.ring .t .v{font-family:var(--f-num);font-size:64px;font-weight:700;line-height:1}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border-radius:12px;padding:12px;text-align:center}
.stat b{display:block;font-family:var(--f-num);font-size:26px;line-height:1.2}
.stat span{font-size:12px;color:var(--muted)}
.up{display:grid;grid-template-columns:1fr auto;gap:4px 8px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.up:first-child{border-top:0}
.up .arrow{color:var(--good);font-family:var(--f-num);font-weight:600}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:72px 1fr 40px;gap:8px;align-items:center;font-size:13px}
.bar .track{height:10px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.bar .track i{display:block;height:100%;background:var(--accent);border-radius:6px}
.bar .v{text-align:right;color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:12px}
.cal span{padding:6px 0;border-radius:8px;color:var(--muted)}
.cal .h{color:var(--faint)}
.cal .w{background:var(--accent-soft);color:var(--accent);font-weight:600}
.cal .td{outline:1px solid var(--accent);outline-offset:-1px}

.gear{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g{background:var(--surface);border-radius:12px;padding:8px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.g .ph{aspect-ratio:4/3;max-width:100%;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;color:var(--faint);overflow:hidden}
.g .ph img{width:100%;height:100%;object-fit:cover}
.g .nm{font-weight:600;font-size:14px}
.g .meta{font-size:11px;color:var(--muted)}
.g.add{border:1.5px dashed var(--line);background:transparent;align-items:center;justify-content:center;color:var(--muted);min-height:150px}
.gear-more{display:flex;flex-wrap:wrap;gap:6px}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:440px;max-height:88%;overflow:auto;border-radius:20px 20px 0 0;padding:8px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:4px auto 12px}
.steps{display:flex;flex-direction:column;gap:10px}
.stepc{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.stepc .k{width:28px;height:28px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-family:var(--f-num);font-weight:700;color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{padding:6px 10px;border-radius:99px;background:var(--surface-2);font-size:13px;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.filebtn{display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;border-radius:10px;background:var(--surface-2);font-size:13px;cursor:pointer;position:relative}
.filebtn input{position:absolute;opacity:0;width:1px;height:1px}
.field{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);font:inherit}
.tips{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.alt{display:flex;flex-direction:column;gap:6px}
.altrow{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;padding:10px;border-radius:12px;background:var(--surface-2);text-align:left;width:100%}
.altrow .thumb{width:44px;height:44px;background:var(--bg)}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:99px;font-size:13px;z-index:50;max-width:calc(100% - 32px);text-align:center}
.notice{font-size:13px;color:var(--warn);background:rgba(232,179,65,.1);border-radius:10px;padding:8px 12px}
.info{font-size:13px;color:var(--info);background:rgba(106,169,255,.1);border-radius:10px;padding:8px 12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="app" class="app"></div>
<div id="dock" class="dock"></div>
<div id="layer"></div>

<script>
(function(){
'use strict';

// ===== 우리 헬스장 기구 (사진으로 확인한 목록) =====
var GEAR = [
  {id:'lp_pin',n:'레그프레스 (핀 머신)',cat:'하체'},
  {id:'lp_45',n:'45도 레그프레스 (원판)',cat:'하체'},
  {id:'leg_ext',n:'레그 익스텐션',cat:'하체'},
  {id:'leg_curl',n:'레그 컬',cat:'하체'},
  {id:'adductor',n:'이너 타이',cat:'하체'},
  {id:'chest_press',n:'시티드 체스트 프레스',cat:'가슴'},
  {id:'incline',n:'인클라인 프레스',cat:'가슴'},
  {id:'pec_deck',n:'펙덱 플라이',cat:'가슴'},
  {id:'lat_pd',n:'랫풀다운 · 어시스트 친업',cat:'등'},
  {id:'cable',n:'케이블 머신',cat:'등'},
  {id:'tbar',n:'티바 로우',cat:'등'},
  {id:'sh_press',n:'숄더 프레스 머신',cat:'어깨'},
  {id:'arm_curl',n:'암컬 머신',cat:'팔'},
  {id:'smith',n:'스미스 머신 · 파워랙',cat:'프리웨이트'},
  {id:'db',n:'덤벨',cat:'프리웨이트'},
  {id:'bench',n:'벤치 (플랫·각도 조절)',cat:'프리웨이트'},
  {id:'back_ext',n:'백 익스텐션',cat:'코어'},
  {id:'decline',n:'디클라인 싯업 벤치',cat:'코어'},
  {id:'cardio',n:'러닝머신 · 계단 · 자전거',cat:'유산소'}
];
var GMAP = {}; GEAR.forEach(function(g){GMAP[g.id]=g});
function hasGear(id){return id==='body'||!!GMAP[id]}

// ===== 운동 사전 =====
// rec: 회복 계산 부위 · cau: 조심할 부위를 고르면 자동 추천에서 빠짐 · lvl 2: 7주차 이후 · assist: 보조 무게(많을수록 쉬움)
var LIB = {
  lp_pin:{n:'레그프레스',part:'하체',rec:'하체 앞',gear:'lp_pin',step:5,reps:[10,12],cau:['무릎'],tips:['허리와 엉덩이를 등받이에 붙인 채로','무릎을 끝까지 펴서 잠그지 않기','내릴 때 2초, 밀 때 1초']},
  lp_45:{n:'45도 레그프레스',part:'하체',rec:'하체 앞',gear:'lp_45',step:10,reps:[10,12],lvl:2,cau:['무릎','허리'],tips:['발판 자체 무게가 무거우니 원판 없이 먼저 해보기','안전 손잡이 위치 확인','엉덩이가 들리지 않는 깊이까지만']},
  goblet:{n:'고블릿 스쿼트',part:'하체',rec:'하체 앞',gear:'db',step:2,reps:[10,12],cau:['무릎'],tips:['덤벨 한 개를 가슴 앞에 세워 들기','무릎은 발끝 방향','가슴을 세운 채 앉기']},
  leg_ext:{n:'레그 익스텐션',part:'하체',rec:'하체 앞',gear:'leg_ext',step:5,reps:[12,15],cau:['무릎'],tips:['무릎 관절과 기계 회전축을 맞추기','끝에서 1초 멈추기','반동 없이 천천히 내리기']},
  leg_curl:{n:'레그 컬',part:'하체',rec:'햄스트링',gear:'leg_curl',step:5,reps:[10,12],cau:[],tips:['무릎과 회전축 맞추기','엉덩이가 들리지 않게','내릴 때 2초']},

function plan(){
  var pct=intensity(),adj={short:-1,normal:0,long:1}[S.time];
  return today().items.map(function(it,idx){
    var e=LIB[it.id],n=Math.max(1,it.sets+adj),note='',rv=REC[e.rec];
    if(rv<50){n=0;note=e.rec+' 회복 '+rv+'% · 오늘은 쉬어요'}
    else if(rv<80){n=Math.max(1,n-1);note=e.rec+' 회복 '+rv+'% · 세트 1개 줄였어요'}
    if(pct===80&&n>1)n--;
    var w0=WSTART[it.id]||0,w=0;
    if(e.step){w=e.assist?roundTo(w0*(pct<100?100+(100-pct)/2:100)/100,e.step):roundTo(w0*Math.min(pct,100)/100,e.step)}
    var warm=[];
    if(idx===0&&w>=20&&!e.assist)[0.4,0.6].forEach(function(r){var v=roundTo(w*r,e.step);if(v<w&&warm.indexOf(v)<0)warm.push(v)});
    return {id:it.id,e:e,n:n,w:w,note:note,warm:warm};
  });
}

}
function curSet(){return S.sets[S.cur]}

  var main=GEAR.filter(function(g){return firstEx(g.id)}),rest=GEAR.filter(function(g){return !firstEx(g.id)});
  var h='<div class="stack"><h1>내 정보</h1>';
  h+='<section class="card stack"><div class="row between"><h2>내 프로그램</h2><button class="link" data-act="openprog">보기 · 수정</button></div><div class="ex-meta">'+D.prog.map(function(x){return x.name+' '+x.items.length+'개'}).join(' · ')+' · 주 '+D.settings.freq+'회 · '+D.settings.minutes+'분</div></section>';
  h+='<section class="stack"><div class="row between"><h2>우리 헬스장 기구</h2><span class="muted small">'+(GEAR.length+D.extraGear.length)+'개</span></div><div class="gear">';
  main.forEach(function(g){h+=gearCard(g)});
  D.extraGear.forEach(function(g,i){h+='<div class="g"><span class="ph">'+(g.img?'<img alt="" src="'+g.img+'">':I.machine)+'</span><span class="nm">'+esc(g.nm)+'</span><span class="meta">직접 추가</span></div>'});
  h+='<button class="g add" data-act="addgear">'+I.cam+'<span>기구 추가</span><span class="meta">종류 고르기 + 메모</span></button></div>';
  h+='<p class="muted small">그 밖의 기구</p><div class="gear-more">'+rest.map(function(g){return '<button class="mini" data-act="gearinfo" data-g="'+g.id+'">'+g.n+'</button>'}).join('')+'</div></section>';
  h+='<section class="card stack"><h2>내 데이터</h2><div class="ex-meta">모든 기록과 사진은 이 폰 안에만 저장돼요. 폰을 바꿀 때를 대비해 한 달에 한 번 백업하세요.</div><div class="btns"><button class="btn sec sm" data-act="toast" data-msg="백업 파일 만들기는 1차 버전에서 연결돼요">백업 내보내기</button><button class="btn sec sm" data-act="toast" data-msg="백업 불러오기는 1차 버전에서 연결돼요">불러오기</button></div></section></div>';
  return h;
}
function firstEx(gid){var k=Object.keys(LIB).filter(function(k){return LIB[k].gear===gid&&FIG[k]});return k[0]}
function usesOf(gid){return Object.keys(LIB).filter(function(k){return LIB[k].gear===gid})}
function gearCard(g){var m=D.memos[g.id],n=usesOf(g.id).length;return '<button class="g" data-act="gearinfo" data-g="'+g.id+'"><span class="ph">'+fig(firstEx(g.id),1)+'</span><span class="nm">'+g.n+'</span><span class="meta">운동 '+n+'가지 · '+(m?'세팅 메모 있음':'메모 없음')+'</span></button>'}

// ===== 시트 =====
function sheetEx(id){
  var e=LIB[id],g=GMAP[e.gear];
  var h='<h2>'+e.n+'</h2><div class="muted small" style="margin-bottom:10px">'+e.part+' · '+repsText(e)+' · '+(g?g.n:'기구 없이')+'</div><div class="stack">';
  h+=figBox(id);
  h+='<div><h3 style="margin-bottom:6px">자세 포인트</h3><ol class="tips">'+e.tips.map(function(t){return '<li>'+t+'</li>'}).join('')+'</ol></div>';
  if(g)h+=memoField(e.gear);
  return h+'<button class="btn sec" data-act="close">닫기</button></div>';
}
function sheetGear(gid){
  var g=GMAP[gid],uses=usesOf(gid);
  var h='<h2>'+g.n+'</h2><div class="muted small" style="margin-bottom:10px">'+g.cat+'</div><div class="stack">';
  if(firstEx(gid))h+=figBox(firstEx(gid));
  h+=memoField(gid);
  if(uses.length)h+='<div><h3 style="margin-bottom:6px">이 기구로 하는 운동</h3><div class="chips">'+uses.map(function(k){return '<button data-act="exinfo" data-id="'+k+'">'+LIB[k].n+'</button>'}).join('')+'</div></div>';
  return h+'<button class="btn sec" data-act="close">닫기</button></div>';
}
function memoField(gid){return '<div><h3 style="margin-bottom:6px">내 세팅 메모</h3><div class="row"><input id="f-memo" class="field" data-g="'+gid+'" placeholder="예: 의자 4번, 등받이 2칸" value="'+esc(D.memos[gid]||'')+'"><button class="mini" data-act="savememo" data-g="'+gid+'" style="padding:12px">저장</button></div></div>'}
function sheetAddGear(){
  var g=S.newGear,kinds=GEAR.map(function(x){return x.n});
  var h='<h2>기구 추가</h2><p class="muted small" style="margin:4px 0 12px">안내판 사진은 글자를 읽는 데만 쓰고, 이 폰 안에만 저장돼요.</p><div class="steps">';
  h+='<div class="stepc"><span class="k">1</span><div class="stack" style="gap:6px"><b>어떤 기구인가요?</b><span class="muted" style="font-size:12px">고르면 그 기구로 하는 운동 그림이 자동으로 붙어요.</span><div class="chips">'+kinds.concat(['기타']).map(function(k){return '<button data-act="kind" data-k="'+k+'" aria-pressed="'+(g.kind===k)+'">'+k+'</button>'}).join('')+'</div></div></div>';
  h+='<div class="stepc"><span class="k">2</span><div class="stack" style="gap:6px"><b>안내판 사진 <span class="muted" style="font-weight:400">(선택)</span></b>'+(g.usage?'<div class="photo has"><img alt="찍은 사용법 사진" src="'+g.usage+'"></div>':'')+'<label class="filebtn">'+I.cam+(g.usage?'다시 찍기':'안내판 찍기')+'<input id="f-usage" type="file" accept="image/*" capture="environment" data-slot="usage"></label><span class="muted" style="font-size:12px">2차 버전에서는 안내판 글자를 읽어 기구 이름을 먼저 골라줘요.</span></div></div>';
  h+='</div><button class="btn pri" data-act="savegear" style="margin-top:14px"'+(g.kind?'':' disabled')+'>'+(g.kind?g.kind+' 저장':'기구 종류를 골라주세요')+'</button>';
  return h;
}
function openSheet(html){layer.innerHTML='<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>'+html+'</div></div>'}
function closeSheet(){layer.innerHTML=''}
function toast(msg){var t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.remove()},2400)}

// ===== 렌더 =====
function render(){
  var full=S.screen!=='home';
  app.className='app'+(full?' full':'');
  if(S.screen==='work')app.innerHTML=vWork();
  else if(S.screen==='rest')app.innerHTML=vRest();
  else if(S.screen==='done')app.innerHTML=vDone();
  else if(S.view==='prog')app.innerHTML=vProg();
  else app.innerHTML=S.tab==='today'?vHome():S.tab==='rec'?vRecords():vMe();
  dock.hidden=full;
  if(!full)dock.innerHTML='<nav class="tabs" aria-label="메뉴">'+tab('today','오늘',I.today)+tab('rec','기록',I.rec)+tab('me','내 정보',I.me)+'</nav><div class="ad" role="complementary" aria-label="광고"><b>AD</b>광고 한 줄 자리 · 운동 중에는 나오지 않아요</div>';
}
function tab(k,label,ico){return '<button data-act="tab" data-k="'+k+'" aria-current="'+(S.tab===k&&!S.view?'page':'false')+'">'+ico+label+'</button>'}

setInterval(function(){
  if(S.screen==='work'){var c=document.getElementById('clock');if(c)c.textContent=elapsed()}
  if(S.screen==='rest'){
    var left=restLeft(),rt=document.getElementById('rt'),arc=document.getElementById('arc');
    if(rt)rt.textContent=fmtRest();
    if(arc)arc.setAttribute('stroke-dashoffset',(552.9*(1-left/S.restTotal)).toFixed(1));
    if(left===3&&!S.said3){S.said3=true;say('3초')}
    if(left<=0){beep();buzz();S.screen='work';render();announce()}
  }
},250);

function editItem(i){var it=D.prog[S.pday].items[i];it.edited=true;return it}
document.addEventListener('click',function(ev){
  var t=ev.target.closest('[data-act]');if(!t||t.disabled)return;
  var a=t.dataset.act,i=t.dataset.i===''||t.dataset.i==null?null:+t.dataset.i;
  if(a==='scrim'){if(ev.target===t)closeSheet();return}
  if(a==='tab'){S.tab=t.dataset.k;S.view=null;render();window.scrollTo(0,0)}
  else if(a==='time'){S.time=t.dataset.k;render()}
  else if(a==='cond'){S.cond[t.dataset.k]=+t.dataset.v;render()}
  else if(a==='start'){startWorkout();window.scrollTo(0,0)}
  // 프로그램
  else if(a==='openprog'){S.view='prog';S.pday=0;render();window.scrollTo(0,0)}
  else if(a==='closeprog'){S.view=null;render();window.scrollTo(0,0)}
  else if(a==='pday'){S.pday=i;render()}
  else if(a==='mv'){var its=D.prog[S.pday].items,j=i+(+t.dataset.d),tmp=its[i];its[i]=its[j];its[j]=tmp;tmp.edited=true;save();render()}
  else if(a==='pset'){var it=editItem(i);it.sets=Math.min(6,Math.max(1,it.sets+(+t.dataset.d)));save();render()}
  else if(a==='pdel'){var d0=D.prog[S.pday],nm=LIB[d0.items[i].id].n;d0.items.splice(i,1);d0.changed=true;save();render();toast(nm+'을(를) 뺐어요')}
  else if(a==='pswap'){openSheet(sheetPick('swap',i))}
  else if(a==='padd'){S.addFilter='전체';openSheet(sheetPick('add',null))}
  else if(a==='afilter'){S.addFilter=t.dataset.v;openSheet(sheetPick('add',null))}
  else if(a==='pick'){
    var mode=t.dataset.mode,id=t.dataset.id,pi=t.dataset.i===''?null:+t.dataset.i;
    if(mode==='swap'){var it2=editItem(pi),old=LIB[it2.id].n;it2.id=id;save();closeSheet();render();toast(old+' → '+LIB[id].n)}
    else if(mode==='add'){D.prog[S.pday].items.push({id:id,sets:baseSets(D.settings),edited:true});save();closeSheet();render();toast(LIB[id].n+'을(를) 추가했어요')}
    else if(mode==='today'){var cs=curSet(),from=cs.id,ne=LIB[id];S.sets.forEach(function(s){if(s.id===from&&!s.done){s.id=id;s.e=ne;s.w=WSTART[id]||0;s.reps=ne.reps[1]}});closeSheet();render();toast('오늘만 '+ne.n+'(으)로 바꿨어요. 프로그램은 그대로예요')}
  }
  else if(a==='preset'){D.prog=generate(D.settings);save();render();toast('자동 추천으로 되돌렸어요')}
  else if(a==='settings'){S.settingsDraft=JSON.parse(JSON.stringify(D.settings));openSheet(sheetSettings())}
  else if(a==='sfreq'){S.settingsDraft.freq=+t.dataset.v;openSheet(sheetSettings())}
  else if(a==='smin'){S.settingsDraft.minutes=+t.dataset.v;openSheet(sheetSettings())}
  else if(a==='sgoal'){S.settingsDraft.goal=t.dataset.v;openSheet(sheetSettings())}
  else if(a==='scau'){var cl=S.settingsDraft.caution,v=t.dataset.v,k2=cl.indexOf(v);if(k2>=0)cl.splice(k2,1);else cl.push(v);openSheet(sheetSettings())}
  else if(a==='sapply'){D.settings=S.settingsDraft;D.prog=generate(D.settings);S.pday=0;S.time=D.settings.minutes<=30?'short':D.settings.minutes>=60?'long':'normal';save();closeSheet();render();toast('새 기준으로 다시 추천했어요')}
  // 운동 중
  else if(a==='voice'){S.voice=!S.voice;render();if(S.voice)say('음성 코칭을 켰어요')}
  else if(a==='adj'){var c=curSet(),fd=t.dataset.f,dd=+t.dataset.d;if(fd==='w')c.w=Math.max(c.e.assist?0:c.e.step,c.w+dd*c.e.step);else c.reps=Math.max(1,c.reps+dd*(c.e.sec?5:1));render()}
  else if(a==='done'){S.askFeel=true;render()}
  else if(a==='feel'){
    var c2=curSet();c2.done=true;c2.feel=t.dataset.v;S.askFeel=false;
    if(S.cur>=S.sets.length-1){S.screen='done';keepAwake(false);say('오늘 운동 끝. 수고했어요');render();window.scrollTo(0,0);return}
    var nx=S.sets[S.cur+1];S.cur++;S.said3=false;
    S.restTotal=c2.kind==='warm'?45:(nx.id!==c2.id?120:(c2.e.step?90:60));
    S.restEnd=Date.now()+S.restTotal*1000;S.screen='rest';render();window.scrollTo(0,0)
  }
  else if(a==='rest'){S.restEnd=Math.max(Date.now()+5000,S.restEnd+(+t.dataset.d)*1000);S.restTotal=Math.max(S.restTotal,restLeft());render()}
  else if(a==='skip'){S.screen='work';render();announce()}
  else if(a==='finish'){S.screen=S.sets.some(function(s){return s.done})?'done':'home';keepAwake(false);render()}
  else if(a==='home'){S.screen='home';S.tab='today';S.view=null;render();window.scrollTo(0,0)}
  else if(a==='talt'){openSheet(sheetPick('today',null))}
  else if(a==='memo'){openSheet(sheetGear(t.dataset.g))}
  // 정보·기구
  else if(a==='exinfo'){openSheet(sheetEx(t.dataset.id))}
  else if(a==='gearinfo'){openSheet(sheetGear(t.dataset.g))}
  else if(a==='savememo'){var inp=document.getElementById('f-memo'),gid=t.dataset.g,val=(inp&&inp.value||'').trim().slice(0,80);if(val)D.memos[gid]=val;else delete D.memos[gid];save();closeSheet();render();toast(val?'세팅 메모를 저장했어요':'메모를 지웠어요')}
  else if(a==='addgear'){S.newGear={kind:null,photo:null,usage:null};openSheet(sheetAddGear())}
  else if(a==='kind'){S.newGear.kind=t.dataset.k;openSheet(sheetAddGear())}
  else if(a==='savegear'){if(!S.newGear.kind)return;D.extraGear.push({nm:S.newGear.kind,img:null});save();closeSheet();render();toast(S.newGear.kind+' 카드를 추가했어요 (시안이라 사진은 저장하지 않아요)')}
  else if(a==='close'){closeSheet()}
  else if(a==='toast'){toast(t.dataset.msg)}
});
document.addEventListener('change',function(ev){
  var inp=ev.target;if(!inp.dataset||!inp.dataset.slot||!inp.files||!inp.files[0])return;
  var slot=inp.dataset.slot,r=new FileReader();
  r.onload=function(){var im=new Image();im.onload=function(){var s=Math.min(1,640/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.round(im.width*s);cv.height=Math.round(im.height*s);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);S.newGear[slot]=cv.toDataURL('image/jpeg',.8);openSheet(sheetAddGear())};im.src=r.result};
  r.readAsDataURL(inp.files[0]);
});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&layer.innerHTML)closeSheet()});

render();
})();
</script>
