<title>짐코치 시안</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<style>
/* 레이아웃: 폰 한 화면 폭(최대 440px) 세로 앱. 홈·기록·내 정보는 하단 탭, 운동 중·휴식은 전체 화면(탭·광고 숨김). */
:root{
  --bg:#121417; --surface:#1b1e23; --surface-2:#262a31; --line:#30353d;
  --fg:#eef0f3; --muted:#9aa1ac; --faint:#6b727d;
  --accent:#ff8a3d; --accent-ink:#1f1006; --accent-soft:rgba(255,138,61,.14);
  --good:#4cc38a; --warn:#e8b341; --bad:#e5534b;
  --f-text:'IBM Plex Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-num:'Barlow Semi Condensed','IBM Plex Sans KR',system-ui,sans-serif;
  --r:14px;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-text);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
.app{max-width:440px;margin:0 auto;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 150px}
.app.full{padding-bottom:32px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.muted{color:var(--muted)}
.eyebrow{font-size:12px;color:var(--muted);letter-spacing:.06em}
h1{font-size:22px;line-height:1.3;margin:0;font-weight:700;text-wrap:balance}
h2{font-size:17px;margin:0;font-weight:700}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.card{background:var(--surface);border-radius:var(--r);padding:16px}
.tag{font-size:12px;padding:3px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.tag.acc{background:var(--accent-soft);color:var(--accent)}
.sample{font-size:11px;color:var(--faint);border:1px dashed var(--line);border-radius:6px;padding:1px 6px}

/* 주간 바 */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.day{padding:6px 0 8px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
.day .d{font-size:12px;color:var(--muted)}
.day .n{font-family:var(--f-num);font-size:18px;font-weight:600}
.day .m{font-size:10px;height:14px;color:var(--faint)}
.day.today{background:var(--surface-2)}
.day.today .m{color:var(--accent)}
.day.done .m{color:var(--good)}

/* 근육 그림 */
.bodies{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:center}
.bodies svg{width:100%;height:auto;max-height:180px}
.legend{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.rec-list{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:4px}
.rec-item{background:var(--surface-2);border-radius:10px;padding:6px 4px;text-align:center;font-size:12px}
.rec-item b{display:block;font-family:var(--f-num);font-size:16px}

/* 선택 컨트롤 */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.seg button{padding:8px 4px;border-radius:9px;font-size:14px;color:var(--muted);display:flex;flex-direction:column;align-items:center;line-height:1.25}
.seg button small{font-size:11px;color:var(--faint)}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--fg);font-weight:600}
.seg button[aria-pressed="true"] small{color:var(--accent)}
.cond{display:grid;grid-template-columns:64px 1fr;align-items:center;gap:6px 10px}
.cond .lab{font-size:13px;color:var(--muted)}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.scale button{height:32px;border-radius:8px;background:var(--surface-2);font-family:var(--f-num);font-size:15px;color:var(--muted)}
.scale button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.intensity{display:flex;align-items:baseline;gap:8px}
.intensity .big{font-family:var(--f-num);font-size:34px;font-weight:700;line-height:1}

/* 운동 목록 */
.ex-list{display:flex;flex-direction:column}
.ex{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.ex:first-child{border-top:0}
.ex-ico{width:44px;height:44px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;color:var(--muted)}
.ex-name{font-weight:600}
.ex-meta{font-size:13px;color:var(--muted)}
.ex-note{font-size:12px;color:var(--warn);margin-top:2px}
.ex .go{color:var(--faint);font-size:13px}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px;border-radius:14px;font-weight:700;font-size:16px}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.sec{background:var(--surface-2)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--muted);font-weight:500}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* 하단 탭 + 광고 */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs{max-width:440px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tabs button{padding:10px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--faint)}
.tabs button[aria-current="page"]{color:var(--fg)}
.tabs button[aria-current="page"] svg{color:var(--accent)}
.ad{max-width:440px;margin:0 auto;text-align:center;font-size:12px;color:var(--faint);padding:6px 16px 8px;border-top:1px dashed var(--line)}
.ad b{font-weight:500;color:var(--muted);margin-right:6px}

/* 운동 중 */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 0 8px}
.pill{padding:8px 12px;border-radius:99px;background:var(--surface-2);font-size:13px;display:inline-flex;gap:6px;align-items:center}
.pill[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.progress{height:4px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.photo{aspect-ratio:16/9;max-width:100%;border:1.5px dashed var(--line);border-radius:12px;display:grid;place-items:center;text-align:center;color:var(--faint);font-size:13px;background:var(--surface-2);overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover}
.memo{font-size:13px;background:var(--surface-2);border-radius:10px;padding:8px 12px;display:flex;gap:8px}
.memo b{color:var(--accent);font-weight:600;white-space:nowrap}
.sets{display:flex;flex-direction:column;gap:6px}
.set{display:grid;grid-template-columns:64px 1fr 56px;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;font-size:14px;color:var(--muted)}
.set .num{font-size:17px;color:var(--fg)}
.set.cur{background:var(--accent-soft);color:var(--fg)}
.set.done{opacity:.55}
.set .st{text-align:right;font-size:12px}
.set.done .st{color:var(--good)}
.dial{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dial>div{background:var(--surface-2);border-radius:14px;padding:10px 8px;text-align:center}
.dial .v{font-family:var(--f-num);font-size:44px;font-weight:700;line-height:1.05}
.dial .u{font-size:13px;color:var(--muted)}
.dial .pm{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.dial .pm button{height:40px;border-radius:10px;background:var(--bg);font-size:20px;font-family:var(--f-num)}
.feel{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.feel button{padding:14px 4px;border-radius:12px;background:var(--surface-2);font-weight:600}
.feel button small{display:block;font-weight:400;font-size:11px;color:var(--muted)}

/* 휴식 */
.rest{display:flex;flex-direction:column;align-items:center;gap:20px;padding-top:24px;text-align:center}
.ring{position:relative;width:240px;max-width:100%;aspect-ratio:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;align-content:center}
.ring .t .v{font-family:var(--f-num);font-size:64px;font-weight:700;line-height:1}
.next{width:100%}

/* 요약/기록 */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border-radius:12px;padding:12px;text-align:center}
.stat b{display:block;font-family:var(--f-num);font-size:26px;line-height:1.2}
.stat span{font-size:12px;color:var(--muted)}
.up{display:grid;grid-template-columns:1fr auto;gap:4px 8px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.up:first-child{border-top:0}
.up .arrow{color:var(--good);font-family:var(--f-num);font-weight:600}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:72px 1fr 40px;gap:8px;align-items:center;font-size:13px}
.bar .track{height:10px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.bar .track i{display:block;height:100%;background:var(--accent);border-radius:6px}
.bar .v{text-align:right;color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:12px}
.cal span{padding:6px 0;border-radius:8px;color:var(--muted)}
.cal .h{color:var(--faint)}
.cal .w{background:var(--accent-soft);color:var(--accent);font-weight:600}
.cal .td{outline:1px solid var(--accent);outline-offset:-1px}

/* 기구 카드 */
.gear{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g{background:var(--surface);border-radius:12px;padding:8px;text-align:left;display:flex;flex-direction:column;gap:6px}
.g .ph{aspect-ratio:4/3;max-width:100%;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;color:var(--faint)}
.g .nm{font-weight:600;font-size:14px}
.g .meta{font-size:11px;color:var(--muted)}
.g.add{border:1.5px dashed var(--line);background:transparent;align-items:center;justify-content:center;color:var(--muted);min-height:150px}

/* 시트 */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:440px;max-height:86%;overflow:auto;border-radius:20px 20px 0 0;padding:8px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:4px auto 12px}
.steps{display:flex;flex-direction:column;gap:10px}
.stepc{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.stepc .k{width:28px;height:28px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-family:var(--f-num);font-weight:700;color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{padding:6px 10px;border-radius:99px;background:var(--surface-2);font-size:13px;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.filebtn{display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;border-radius:10px;background:var(--surface-2);font-size:13px;cursor:pointer}
.filebtn input{position:absolute;opacity:0;width:1px;height:1px}
.tips{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.alt{display:flex;flex-direction:column;gap:6px}
.alt button{display:flex;justify-content:space-between;padding:12px;border-radius:10px;background:var(--surface-2);text-align:left}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:99px;font-size:13px;z-index:50;max-width:calc(100% - 32px)}
.notice{font-size:13px;color:var(--warn);background:rgba(232,179,65,.1);border-radius:10px;padding:8px 12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="app" class="app"></div>
<div id="dock" class="dock"></div>
<div id="layer"></div>

<script>
(function(){
'use strict';
// ---------- 예시 데이터 (실제 앱에서는 첫 설정과 기록에서 만들어짐) ----------
var REC = {'가슴':100,'어깨':85,'팔':90,'코어':95,'하체 앞':92,'등':70,'엉덩이':65,'햄스트링':60};
var EX = [
  {id:'lp',name:'레그프레스',part:'하체 앞',w:55,step:5,target:12,range:'10~12',eq:'레그프레스 머신',memo:'등받이 3칸 · 발은 발판 가운데, 어깨너비',
   tips:['허리와 엉덩이를 등받이에 붙인 채로','무릎을 끝까지 펴서 잠그지 않기','내릴 때 2초, 밀 때 1초'],alt:['고블릿 스쿼트 (덤벨)','스미스 머신 스쿼트']},
  {id:'cp',name:'체스트 프레스 머신',part:'가슴',w:25,step:5,target:12,range:'10~12',eq:'체스트 프레스 머신',memo:'의자 4번 · 손잡이가 가슴 중간',
   tips:['어깨를 내리고 가슴을 편 상태로','팔꿈치는 몸통에서 45도','돌아올 때 무게를 내려놓지 않기'],alt:['덤벨 벤치프레스','무릎 대고 푸시업']},
  {id:'sr',name:'시티드 로우',part:'등',w:30,step:5,target:12,range:'10~12',eq:'시티드 로우 머신',memo:'가슴 패드 2칸',
   tips:['허리를 세우고 가슴을 패드에','팔이 아니라 팔꿈치를 뒤로 당긴다는 느낌','어깨를 으쓱하지 않기'],alt:['원암 덤벨 로우','랫풀다운']},
  {id:'gb',name:'글루트 브릿지',part:'엉덩이',w:0,step:0,target:15,range:'12~15',eq:'매트',memo:'',
   tips:['발뒤꿈치로 바닥을 밀기','위에서 엉덩이를 1초 조이기','허리를 꺾지 않기'],alt:['힙 어브덕션 머신','덤벨 힙 쓰러스트']},
  {id:'pk',name:'플랭크',part:'코어',w:0,step:0,target:30,range:'30초',sec:true,eq:'매트',memo:'',
   tips:['팔꿈치는 어깨 바로 아래','머리부터 발끝까지 일직선','숨을 참지 않기'],alt:['데드버그','버드독']}
];
var TIMES = [{k:'short',label:'짧게',sets:2},{k:'normal',label:'보통',sets:3},{k:'long',label:'길게',sets:4}];
var WEEK = [{d:'월',n:23,m:'B 완료',c:'done'},{d:'화',n:24,m:'휴식'},{d:'수',n:25,m:'오늘 A',c:'today'},{d:'목',n:26,m:'휴식'},{d:'금',n:27,m:'B'},{d:'토',n:28,m:''},{d:'일',n:29,m:'휴식'}];
var GEAR = [
  {nm:'레그프레스 머신',photos:2,memo:true},{nm:'체스트 프레스 머신',photos:1,memo:true},{nm:'시티드 로우 머신',photos:2,memo:true},
  {nm:'랫풀다운 머신',photos:0,memo:false},{nm:'덤벨 1~20kg',photos:1,memo:false},{nm:'플랫 벤치',photos:0,memo:false}
];
var GEAR_KINDS = ['랫풀다운','레그프레스','체스트 프레스','시티드 로우','레그 익스텐션','레그 컬','케이블 머신','스미스 머신','덤벨','벤치','러닝머신','실내 자전거'];

var S = {tab:'today',screen:'home',time:'normal',cond:{sleep:4,sore:3,mood:3},voice:false,sets:[],cur:0,start:0,restEnd:0,restTotal:90,askFeel:false,sheet:null,newGear:{kind:null,photo:null,usage:null}};
var app = document.getElementById('app'), dock = document.getElementById('dock'), layer = document.getElementById('layer');

// ---------- 계산 ----------
function avgCond(){var c=S.cond;return (c.sleep+c.sore+c.mood)/3}
function intensity(){var a=avgCond();return a>=4.5?110:a>=3?100:a>=2?80:50}
function round(w,step){if(!step)return 0;return Math.max(step,Math.round(w/step)*step)}
function recColor(v){return v>=80?'var(--good)':v>=50?'var(--warn)':'var(--bad)'}
function plan(){
  var pct=intensity(), base=TIMES.filter(function(t){return t.k===S.time})[0].sets;
  return EX.map(function(e){
    var n=base, note='';
    var rv=REC[e.part];
    if(rv<50){n=0;note=e.part+' 회복 '+rv+'% · 오늘은 쉬어요'}
    else if(rv<80){n=Math.max(1,n-1);note=e.part+' 회복 '+rv+'% · 세트 1개 줄였어요'}
    if(pct===80&&n>1){n=n-1}
    var w=e.w?round(e.w*Math.min(pct,100)/100,e.step):0;
    if(pct===110&&e.w)w=e.w;
    var warm=(e===EX[0]&&w>=20)?[round(w*0.4,e.step),round(w*0.6,e.step)]:[];
    return {e:e,n:n,w:w,note:note,warm:warm};
  });
}
function minutes(p){var s=0;p.forEach(function(x){s+=x.n+x.warm.length});return Math.round(s*2.3+10)}
function fmtSet(x,w,reps){var e=x.e;return e.sec?reps+'초':(w?w+'kg × ':'맨몸 × ')+reps+'회'}

// ---------- 소리·음성·진동 (모두 실패해도 괜찮게) ----------
var actx=null;
function beep(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();var o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;g.gain.value=.08;o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+.25)}catch(e){}}
function buzz(){try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
function say(t){if(!S.voice)return;try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';speechSynthesis.speak(u)}catch(e){}}
var wake=null;
function keepAwake(on){try{if(on&&navigator.wakeLock){navigator.wakeLock.request('screen').then(function(l){wake=l}).catch(function(){})}else if(!on&&wake){wake.release();wake=null}}catch(e){}}

// ---------- 아이콘 ----------
var I = {
  today:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 8v8M18 8v8M3 10v4M21 10v4M6 12h12"/></svg>',
  rec:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V12M12 20V5M19 20v-9"/></svg>',

// ---------- 운동 진행 ----------
function startWorkout(){
  var p=plan(), sets=[];
  p.forEach(function(x){
    if(!x.n)return;
    x.warm.forEach(function(w,j){sets.push({x:x,kind:'warm',no:j+1,w:w,reps:10})});
    for(var s=1;s<=x.n;s++)sets.push({x:x,kind:'main',no:s,w:x.w,reps:x.e.target});
  });
  S.sets=sets;S.cur=0;S.start=Date.now();S.screen='work';S.askFeel=false;
  keepAwake(true);announce();render();
}
function curSet(){return S.sets[S.cur]}
function announce(){var c=curSet();if(!c)return;say(c.x.e.name+', '+(c.kind==='warm'?'워밍업 '+c.no:c.no+'세트')+'. '+(c.x.e.sec?c.reps+'초':(c.w?c.w+'킬로 ':'')+c.reps+'회'))}
function exGroups(){var g=[];S.sets.forEach(function(s){if(g.indexOf(s.x)<0)g.push(s.x)});return g}
function elapsed(){var s=Math.floor((Date.now()-S.start)/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}

function vWork(){
  var c=curSet(), x=c.x, e=x.e, g=exGroups(), gi=g.indexOf(x);

  h+='<div class="progress" aria-hidden="true"><i style="width:'+Math.round(doneCount/S.sets.length*100)+'%"></i></div>';
  h+='<div class="row between"><span class="eyebrow">'+(gi+1)+' / '+g.length+' 운동 · '+e.part+'</span><span class="eyebrow">목표 '+e.range+'</span></div>';

  h+='<div class="photo" aria-label="내 기구 사진 자리">'+(e.photo?'<img alt="" src="'+e.photo+'">':'<div>'+I.cam+'<br>우리 헬스장 '+e.eq+' 사진 자리<br><span style="font-size:11px">기구 카드에서 찍은 사진이 여기에 나와요</span></div>')+'</div>';
  if(e.memo)h+='<div class="memo"><b>내 세팅</b><span>'+e.memo+'</span></div>';
  h+='<div class="btns"><button class="btn ghost" data-act="gear" data-i="'+EX.indexOf(e)+'">사용법 · 자세</button><button class="btn ghost" data-act="alt">다른 운동으로 대체</button></div>';
  h+='<div class="sets">';

    if(s.x!==x)return;

    h+='<div class="set '+cls+'"><span>'+(s.kind==='warm'?'워밍업 '+s.no:s.no+'세트')+'</span><span class="num">'+fmtSet(x,s.w,s.reps)+'</span><span class="st">'+st+'</span></div>';

    h+='<div class="dial">';

    else h+='<div><div class="v num" style="font-size:30px;padding:8px 0">맨몸</div><div class="u">무게 없음</div></div>';

function restLeft(){return Math.max(0,Math.ceil((S.restEnd-Date.now())/1000))}
function fmtRest(){var s=restLeft();return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}

function vDone(){
  var done=S.sets.filter(function(s){return s.done}), vol=0;
  done.forEach(function(s){if(s.kind==='main'&&s.w&&!s.x.e.sec)vol+=s.w*s.reps});
  var mins=Math.max(1,Math.round((Date.now()-S.start)/60000));
  var h='<div class="stack" style="padding-top:12px"><div class="eyebrow">운동 완료</div><h1>수고했어요. 오늘도 한 걸음 늘었어요</h1>';
  h+='<div class="stats"><div class="stat"><b class="num">'+mins+'</b><span>분</span></div><div class="stat"><b class="num">'+done.length+'</b><span>세트</span></div><div class="stat"><b class="num">'+vol.toLocaleString('ko-KR')+'</b><span>볼륨 kg</span></div></div>';
  h+='<section class="card"><h2 style="margin-bottom:6px">다음 운동은 이렇게</h2>';
  exGroups().forEach(function(x){
    var ms=S.sets.filter(function(s){return s.x===x&&s.kind==='main'&&s.done});
    if(!ms.length){h+='<div class="up"><span>'+x.e.name+'</span><span class="muted">기록 없음</span></div>';return}
    var hit=ms.every(function(s){return s.reps>=x.e.target}), hard=ms.some(function(s){return s.feel==='힘듦'}), easy=ms.filter(function(s){return s.feel==='쉬움'}).length>=2;
    var msg, cls='muted';
    if(x.e.w&&(hit||easy)&&!hard){msg='<span class="arrow">'+ms[0].w+' → '+(ms[0].w+x.e.step)+'kg ↑</span>';cls=''}
    else if(!x.e.w&&(hit||easy)&&!hard){msg='<span class="arrow">'+(x.e.target+(x.e.sec?10:2))+(x.e.sec?'초':'회')+' ↑</span>'}
    else msg='<span class="muted">같은 무게로 한 번 더</span>';
    h+='<div class="up"><span>'+x.e.name+'</span>'+msg+'</div>';
  });
  h+='</section><p class="muted" style="margin:0;font-size:13px">목표 횟수를 모두 채우고 "힘듦"이 없으면 다음엔 한 단계 올려요. 가슴·하체 앞은 72시간 뒤에 다시 회복돼요.</p>';
  h+='<button class="btn pri" data-act="home">홈으로</button></div>';
  return h;
}

function vMe(){
  var h='<div class="stack"><div class="row between"><h1>내 정보</h1><span class="sample">예시 데이터</span></div>';
  h+='<section class="stack"><div class="row between"><h2>우리 헬스장 기구</h2><span class="muted" style="font-size:13px">'+GEAR.length+'개 등록</span></div><div class="gear">';
  GEAR.forEach(function(g,i){h+='<button class="g" data-act="gearcard" data-i="'+i+'"><span class="ph">'+(g.img?'<img alt="" src="'+g.img+'" style="width:100%;height:100%;object-fit:cover;border-radius:8px">':I.machine)+'</span><span class="nm">'+g.nm+'</span><span class="meta">사진 '+g.photos+'/2 · '+(g.memo?'세팅 메모 있음':'메모 없음')+'</span></button>'});
  h+='<button class="g add" data-act="addgear">'+I.cam+'<span>기구 추가</span><span class="meta">사진 2장 + 메모</span></button></div></section>';
  h+='<section class="card stack"><h2>내 플랜</h2><div class="ex-meta">근력·체형 · 주 3회 · 45분 · 조심할 부위: 없음</div><button class="btn sec" data-act="toast" data-msg="시안에서는 첫 설정 질문 5개가 아직 연결되지 않았어요">플랜 다시 만들기</button></section>';
  h+='<section class="card stack"><h2>내 데이터</h2><div class="ex-meta">모든 기록과 사진은 이 폰 안에만 저장돼요. 폰을 바꿀 때를 대비해 한 달에 한 번 백업하세요.</div><div class="btns"><button class="btn sec" data-act="toast" data-msg="백업 파일 만들기는 1차 버전에서 연결돼요">백업 내보내기</button><button class="btn sec" data-act="toast" data-msg="백업 불러오기는 1차 버전에서 연결돼요">불러오기</button></div></section>';
  h+='</div>';
  return h;
}

// ---------- 시트 ----------
function sheetGear(i){
  var e=EX[i];
  var h='<h2>'+e.name+'</h2><div class="muted" style="font-size:13px;margin-bottom:10px">'+e.part+' · '+e.eq+'</div><div class="stack">';
  h+='<div class="photo">'+I.cam+'<div>사용법 안내판 사진 자리</div></div>';
  if(e.memo)h+='<div class="memo"><b>내 세팅</b><span>'+e.memo+'</span></div>';
  h+='<div><h2 style="font-size:15px;margin-bottom:6px">자세 포인트</h2><ol class="tips">'+e.tips.map(function(t){return '<li>'+t+'</li>'}).join('')+'</ol></div>';
  h+='<button class="btn sec" data-act="close">닫기</button></div>';
  return h;
}
function sheetAlt(){
  var c=curSet(), e=c.x.e;
  var h='<h2>'+e.name+' 대신</h2><div class="muted" style="font-size:13px;margin-bottom:10px">같은 부위('+e.part+')를 쓰는, 우리 헬스장에 있는 운동이에요.</div><div class="alt">';
  e.alt.forEach(function(a){h+='<button data-act="doalt" data-n="'+a+'"><span>'+a+'</span><span class="muted">바꾸기</span></button>'});
  return h+'</div><button class="btn ghost" data-act="close" style="margin-top:12px">취소</button>';
}
function sheetAdd(){
  var g=S.newGear;
  var h='<h2>기구 추가</h2><div class="muted" style="font-size:13px;margin-bottom:12px">사진은 이 폰 안에만 저장돼요.</div><div class="steps">';
  h+='<div class="stepc"><span class="k">1</span><div class="stack" style="gap:6px"><b>기구 전체 사진</b>'+(g.photo?'<div class="photo"><img alt="찍은 기구 사진" src="'+g.photo+'"></div>':'')+'<label class="filebtn">'+I.cam+(g.photo?'다시 찍기':'사진 찍기 또는 고르기')+'<input id="f-photo" type="file" accept="image/*" capture="environment" data-slot="photo"></label></div></div>';
  h+='<div class="stepc"><span class="k">2</span><div class="stack" style="gap:6px"><b>사용법 안내판 사진 <span class="muted" style="font-weight:400">(선택)</span></b>'+(g.usage?'<div class="photo"><img alt="찍은 사용법 사진" src="'+g.usage+'"></div>':'')+'<label class="filebtn">'+I.cam+(g.usage?'다시 찍기':'안내판 찍기')+'<input id="f-usage" type="file" accept="image/*" capture="environment" data-slot="usage"></label><span class="muted" style="font-size:12px">2차 버전에서는 안내판 글자를 읽어 기구 이름을 먼저 골라줘요.</span></div></div>';
  h+='<div class="stepc"><span class="k">3</span><div class="stack" style="gap:6px"><b>어떤 기구인가요?</b><div class="chips">'+GEAR_KINDS.map(function(k){return '<button data-act="kind" data-k="'+k+'" aria-pressed="'+(g.kind===k)+'">'+k+'</button>'}).join('')+'</div></div></div>';
  h+='<div class="stepc"><span class="k">4</span><div class="stack" style="gap:6px"><b>내 세팅 메모</b><input id="f-memo" placeholder="예: 의자 4번, 등받이 2칸" style="width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);font:inherit"></div></div>';
  h+='</div><button class="btn pri" data-act="savegear" style="margin-top:14px"'+(g.kind?'':' disabled aria-disabled="true"')+'>'+(g.kind?g.kind+' 저장':'기구 종류를 골라주세요')+'</button>';
  return h;
}
function openSheet(html){layer.innerHTML='<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>'+html+'</div></div>'}
function closeSheet(){layer.innerHTML='';S.sheet=null}
function toast(msg){var t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.remove()},2200)}

// ---------- 렌더 ----------
function render(){
  var full=S.screen==='work'||S.screen==='rest'||S.screen==='done';
  app.className='app'+(full?' full':'');
  if(S.screen==='work')app.innerHTML=vWork();
  else if(S.screen==='rest')app.innerHTML=vRest();
  else if(S.screen==='done')app.innerHTML=vDone();
  else app.innerHTML=S.tab==='today'?vHome():S.tab==='rec'?vRecords():vMe();
  dock.hidden=full;
  if(!full){
    dock.innerHTML='<nav class="tabs" aria-label="메뉴">'+
      tab('today','오늘',I.today)+tab('rec','기록',I.rec)+tab('me','내 정보',I.me)+
      '</nav><div class="ad" role="complementary" aria-label="광고"><b>AD</b>광고 한 줄 자리 · 운동 중에는 나오지 않아요</div>';
  }
}
function tab(k,label,ico){return '<button data-act="tab" data-k="'+k+'" aria-current="'+(S.tab===k?'page':'false')+'">'+ico+label+'</button>'}

// ---------- 타이머 ----------
setInterval(function(){
  if(S.screen==='work'){var c=document.getElementById('clock');if(c)c.textContent=elapsed()}
  if(S.screen==='rest'){
    var left=restLeft(), rt=document.getElementById('rt'), arc=document.getElementById('arc');
    if(rt)rt.textContent=fmtRest();
    if(arc)arc.setAttribute('stroke-dashoffset',(552.9*(1-left/S.restTotal)).toFixed(1));
    if(left===3)say('3초');
    if(left<=0){beep();buzz();S.screen='work';render();announce()}
  }
},250);

// ---------- 이벤트 ----------
document.addEventListener('click',function(ev){
  var t=ev.target.closest('[data-act]');if(!t)return;
  var a=t.dataset.act;
  if(a==='scrim'){if(ev.target===t)closeSheet();return}
  if(a==='tab'){S.tab=t.dataset.k;render();window.scrollTo(0,0)}
  else if(a==='time'){S.time=t.dataset.k;render()}
  else if(a==='cond'){S.cond[t.dataset.k]=+t.dataset.v;render()}
  else if(a==='start'){startWorkout();window.scrollTo(0,0)}
  else if(a==='voice'){S.voice=!S.voice;render();if(S.voice){say('음성 코칭을 켰어요');}}
  else if(a==='adj'){var c=curSet(),f=t.dataset.f,d=+t.dataset.d;if(f==='w')c.w=Math.max(c.x.e.step,c.w+d*c.x.e.step);else c.reps=Math.max(1,c.reps+d*(c.x.e.sec?5:1));render()}
  else if(a==='done'){S.askFeel=true;render()}
  else if(a==='feel'){
    var c2=curSet();c2.done=true;c2.feel=t.dataset.v;S.askFeel=false;
    if(S.cur>=S.sets.length-1){S.screen='done';keepAwake(false);say('오늘 운동 끝. 수고했어요');render();window.scrollTo(0,0);return}
    var nxt=S.sets[S.cur+1];S.cur++;
    S.restTotal=(c2.kind==='warm')?45:(nxt.x!==c2.x?120:(c2.x.e.w?90:60));
    S.restEnd=Date.now()+S.restTotal*1000;S.screen='rest';render();window.scrollTo(0,0)
  }
  else if(a==='rest'){S.restEnd=Math.max(Date.now()+5000,S.restEnd+(+t.dataset.d)*1000);S.restTotal=Math.max(S.restTotal,restLeft());render()}
  else if(a==='skip'){S.screen='work';render();announce()}
  else if(a==='finish'){var any=S.sets.some(function(s){return s.done});if(any){S.screen='done';keepAwake(false)}else{S.screen='home';keepAwake(false)}render()}
  else if(a==='home'){S.screen='home';S.tab='today';render();window.scrollTo(0,0)}
  else if(a==='gear'){openSheet(sheetGear(+t.dataset.i))}
  else if(a==='gearcard'){var gi=+t.dataset.i,map={0:0,1:1,2:2};if(gi in map)openSheet(sheetGear(map[gi]));else openSheet('<h2>'+GEAR[gi].nm+'</h2><div class="stack" style="margin-top:10px"><div class="photo">'+I.cam+'<div>아직 사진이 없어요</div></div><button class="btn sec" data-act="close">닫기</button></div>')}
  else if(a==='alt'){openSheet(sheetAlt())}
  else if(a==='doalt'){var cs=curSet(),old=cs.x.e.name;cs.x.e=Object.assign({},cs.x.e,{name:t.dataset.n,memo:'',photo:null});closeSheet();render();toast(old+' → '+t.dataset.n+'(으)로 바꿨어요')}
  else if(a==='addgear'){S.newGear={kind:null,photo:null,usage:null};openSheet(sheetAdd())}
  else if(a==='kind'){S.newGear.kind=t.dataset.k;var memo=(document.getElementById('f-memo')||{}).value||'';openSheet(sheetAdd());var m=document.getElementById('f-memo');if(m)m.value=memo}
  else if(a==='savegear'){if(!S.newGear.kind)return;var mv=(document.getElementById('f-memo')||{}).value||'';GEAR.push({nm:S.newGear.kind,photos:(S.newGear.photo?1:0)+(S.newGear.usage?1:0),memo:!!mv,img:S.newGear.photo});closeSheet();render();toast(S.newGear.kind+' 카드를 추가했어요 (시안이라 새로고침하면 사라져요)')}
  else if(a==='close'){closeSheet()}
  else if(a==='toast'){toast(t.dataset.msg)}
});
document.addEventListener('change',function(ev){
  var inp=ev.target;if(!inp.dataset||!inp.dataset.slot||!inp.files||!inp.files[0])return;
  var slot=inp.dataset.slot, r=new FileReader();
  r.onload=function(){
    var img=new Image();
    img.onload=function(){
      var s=Math.min(1,640/Math.max(img.width,img.height)),cv=document.createElement('canvas');
      cv.width=Math.round(img.width*s);cv.height=Math.round(img.height*s);
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      S.newGear[slot]=cv.toDataURL('image/jpeg',.8);
      var memo=(document.getElementById('f-memo')||{}).value||'';openSheet(sheetAdd());var m=document.getElementById('f-memo');if(m)m.value=memo;
    };
    img.src=r.result;
  };
  r.readAsDataURL(inp.files[0]);
});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&layer.innerHTML)closeSheet()});

render();
})();
</script>
