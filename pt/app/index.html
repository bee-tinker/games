<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121417">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>짐코치</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<style>
/* 레이아웃: 폰 한 화면 = 한 장면. 장면마다 스크롤 없이 들어가도록 세로 flex로 나누고, 주요 버튼은 화면 아래에 고정. */
:root{
  --bg:#121417; --surface:#1b1e23; --surface-2:#262a31; --line:#30353d;
  --fg:#eef0f3; --muted:#9aa1ac; --faint:#6b727d;
  --accent:#ff8a3d; --accent-ink:#1f1006; --accent-soft:rgba(255,138,61,.14);
  --good:#4cc38a; --warn:#e8b341; --bad:#e5534b; --info:#6aa9ff;
  --skin:#363d47; --skin-hi:#5c6571; --hl:#ef4a4a;
  --p-skin:#b4bcc6; --p-far:#6c7480; --m-frame:#7b838f; --m-dark:#2b3038; --m-pad:#1c1f24; --m-edge:#8e96a2; --m-chrome:#d5d9de; --m-plate:#16181c;
  --f-text:'IBM Plex Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-num:'Barlow Semi Condensed','IBM Plex Sans KR',system-ui,sans-serif;
  --dock:88px;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-text);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
p{margin:0}
.app{max-width:440px;margin:0 auto;height:calc(100dvh - var(--dock) - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
.app.full{height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
.scene{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px}
.grow{flex:1;min-height:0}
.scroll{overflow:auto}
.bottom{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:13px} .faint{color:var(--faint)}
.eyebrow{font-size:12px;color:var(--muted);letter-spacing:.04em}
h1{font-size:22px;line-height:1.3;margin:0;font-weight:700;text-wrap:balance}
h2{font-size:17px;margin:0;font-weight:700}
h3{font-size:15px;margin:0;font-weight:600}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.card{background:var(--surface);border-radius:14px;padding:14px}
.tag{font-size:12px;padding:3px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.tag.acc{background:var(--accent-soft);color:var(--accent)}
.tag.edit{background:rgba(106,169,255,.14);color:var(--info)}
.sample{font-size:11px;color:var(--faint);border:1px dashed var(--line);border-radius:6px;padding:1px 6px;white-space:nowrap}
.link{color:var(--accent);font-size:14px;font-weight:600;padding:6px 0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border-radius:14px;font-weight:700;font-size:16px}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.sec{background:var(--surface-2)}
.btn.ghost{border:1px solid var(--line);color:var(--muted);font-weight:500;padding:11px}
.btn.sm{padding:10px;font-size:14px;border-radius:10px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:36px}
.pill{padding:7px 12px;border-radius:99px;background:var(--surface-2);font-size:13px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.pill[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.steps-dots{display:flex;gap:5px}
.steps-dots i{width:22px;height:4px;border-radius:4px;background:var(--surface-2)}
.steps-dots i.on{background:var(--accent)}

/* 주간 */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.day{padding:5px 0;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:1px}
.day .d{font-size:11px;color:var(--muted)} .day .n{font-family:var(--f-num);font-size:17px;font-weight:600}
.day .m{width:6px;height:6px;border-radius:50%;background:transparent}
.day.today{background:var(--surface-2)} .day.today .m{background:var(--accent)} .day.done .m{background:var(--good)} .day.plan .m{background:var(--faint)}

/* 인체도 */
.bodies{display:grid;grid-template-columns:1fr 1fr;gap:6px;align-items:stretch;justify-items:center}
.bodies svg{height:100%;width:auto;max-width:100%;display:block}
.legend{display:flex;gap:12px;justify-content:center;font-size:12px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:4px;vertical-align:-1px}

/* 안내판 카드 */
.plac{border-radius:12px;overflow:hidden;border:1.5px solid #80868e;background:#0b0c0e;display:flex;flex-direction:column}
.plac-h{background:#d9dcdf;color:#16181b;padding:7px 12px;text-align:center;font-size:17px;font-weight:700}
.plac-b{padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px;color:#e9ebee;min-height:0;flex:1}
.plac-fig{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px}
.plac-mach{flex:1.05;min-height:0;display:flex;align-items:center;justify-content:center;border-bottom:1px solid #2a2e34;padding-bottom:6px}
.plac-mach{position:relative;width:100%;background:none;border-left:0;border-right:0;border-top:0;cursor:pointer}
.plac-mach .mbox{height:100%;display:flex;justify-content:center}
.plac-mach svg{height:100%;width:auto;max-width:100%}
.mhint{position:absolute;right:4px;bottom:6px;font-size:11px;color:#c3c9d1;background:rgba(40,44,50,.85);padding:2px 8px;border-radius:99px}
.plac-mach[data-play="1"] .mhint{color:var(--accent)}
.plac-bodies{flex:1;min-height:0;display:flex;justify-content:center;gap:14px}
.plac-bodies svg{height:100%;width:auto}
.plac-m{font-size:14px;font-weight:700;line-height:1.4;text-align:center}
.plac-t{margin:0;padding-left:18px;font-size:13px;color:#d3d7dc;display:flex;flex-direction:column;gap:2px}

/* 목록 */
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.item:first-child{border-top:0}
.thumb{width:40px;height:40px;border-radius:10px;background:#0b0c0e;display:grid;place-items:center;overflow:hidden;padding:3px}
.thumb svg{width:100%;height:100%}
.nm{font-weight:600;font-size:15px}
.meta{font-size:12.5px;color:var(--muted)}
.note{font-size:12px;color:var(--warn)}
.chev{color:var(--faint);font-size:13px}

/* 선택 */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.seg button{padding:8px 4px;border-radius:9px;font-size:14px;color:var(--muted);display:flex;flex-direction:column;align-items:center;line-height:1.25}
.seg.freq{grid-auto-columns:1fr;gap:3px}
.seg.freq button{padding:10px 0;font-family:var(--f-num);font-size:15px}
.seg button small{font-size:11px;color:var(--faint)}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--fg);font-weight:600}
.seg button[aria-pressed="true"] small{color:var(--accent)}
.q{display:flex;flex-direction:column;gap:6px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale button{height:44px;border-radius:10px;background:var(--surface-2);font-family:var(--f-num);font-size:18px;color:var(--muted)}
.scale button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.ends{display:flex;justify-content:space-between;font-size:11.5px;color:var(--faint)}
.result{display:flex;align-items:center;justify-content:space-between}
.result .big{font-family:var(--f-num);font-size:40px;font-weight:700;line-height:1}
.notice{font-size:13px;color:var(--warn);background:rgba(232,179,65,.1);border-radius:10px;padding:8px 12px}
.info{font-size:13px;color:var(--info);background:rgba(106,169,255,.1);border-radius:10px;padding:8px 12px}

/* 운동 중 */
.progress{height:4px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent)}
.setdots{display:flex;gap:6px;align-items:center}
.setdots i{width:10px;height:10px;border-radius:50%;background:var(--surface-2)}
.setdots i.done{background:var(--good)} .setdots i.cur{background:var(--accent)} .setdots i.warm{width:7px;height:7px}
.dial{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dial>div{background:var(--surface-2);border-radius:14px;padding:8px;display:grid;grid-template-columns:40px 1fr 40px;align-items:center;text-align:center}
.dial .v{font-family:var(--f-num);font-size:38px;font-weight:700;line-height:1}
.dial .u{font-size:12px;color:var(--muted)}
.dial button{height:40px;border-radius:10px;background:var(--bg);font-size:20px;font-family:var(--f-num)}
.feel{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.feel button{padding:13px 4px;border-radius:12px;background:var(--surface-2);font-weight:600}
.feel button small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.wtop{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.wtop .ws{background:var(--surface);border-radius:12px;padding:8px 4px;text-align:center}
.wtop .ws .wl{display:block;font-size:12px;color:var(--muted)}
.wtop .ws b{display:block;font-size:30px;font-weight:700;line-height:1.05;margin:2px 0}
.wtop .ws b small{font-size:16px;color:var(--muted);font-weight:600}
.wtop .ws.now{background:var(--accent-soft)}
.wtop .ws.now b{color:var(--accent)}
.wring{position:relative;width:min(100px,27vw);aspect-ratio:1}
.wring svg{width:100%;height:100%;transform:rotate(-90deg)}
.wring .t{position:absolute;inset:0;display:grid;place-items:center;align-content:center;text-align:center}
.wring .t b{font-size:24px;font-weight:700;line-height:1}
.wring .t .wl{font-size:10px;color:var(--muted);margin-top:3px;line-height:1.2;white-space:nowrap}
@media (max-height:680px){.wring{width:84px}.wring .t b{font-size:20px}}
.wstat{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.wstat>div{background:var(--surface);border-radius:12px;padding:6px 6px 8px;text-align:center}
.wstat .wl{display:block;font-size:12px;color:var(--muted)}
.wstat b{display:block;font-size:32px;font-weight:700;line-height:1.05;color:var(--fg)}
.wstat b small{font-size:17px;color:var(--muted);font-weight:600}
.wstat .now{background:var(--accent-soft)}
.wstat .now b{color:var(--accent)}
.memo{font-size:13px;background:var(--surface-2);border-radius:10px;padding:7px 12px;display:flex;gap:8px;width:100%;text-align:left}
.memo b{color:var(--accent);font-weight:600;white-space:nowrap}
.ring{position:relative;width:min(240px,62vw);aspect-ratio:1;margin:0 auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;align-content:center;text-align:center}
.ring .t .v{font-family:var(--f-num);font-size:60px;font-weight:700;line-height:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-family:var(--f-num);font-size:26px;line-height:1.2}
.stat span{font-size:12px;color:var(--muted)}
.up{display:grid;grid-template-columns:1fr auto;gap:8px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.up:first-child{border-top:0}
.arrow{color:var(--good);font-family:var(--f-num);font-weight:600}

/* 기록 */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:12.5px}
.cal span{padding:7px 0;border-radius:8px;color:var(--muted)}
.cal .h{color:var(--faint)} .cal .w{background:var(--accent-soft);color:var(--accent);font-weight:600} .cal .td{outline:1px solid var(--accent);outline-offset:-1px}
.bars{display:flex;flex-direction:column;gap:12px}
.bar{display:grid;grid-template-columns:64px 1fr 44px;gap:8px;align-items:center;font-size:13.5px}
.bar .track{height:12px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.bar .track i{display:block;height:100%;background:var(--accent);border-radius:6px}
.bar .v{text-align:right;color:var(--muted)}

/* 내 정보 */
.menu{display:flex;flex-direction:column;gap:8px}
.mrow{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;background:var(--surface);border-radius:14px;padding:16px;text-align:left;width:100%}
.gear{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g{background:var(--surface);border-radius:12px;padding:8px;text-align:left;display:grid;grid-template-columns:48px 1fr;gap:8px;align-items:center;min-width:0}
.g .thumb{width:48px;height:44px}
.g.tog{grid-template-columns:44px 1fr auto}
.g.tog .thumb{width:44px}
.g.off .thumb,.g.off .gn,.g.off .gm{opacity:.38}
.g.tog[aria-pressed="true"]{box-shadow:inset 0 0 0 1.5px var(--accent-soft)}
.sw{width:34px;height:20px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .15s}
.sw i{position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#e9ebee;transition:left .15s}
.sw.on{background:var(--accent)}
.sw.on i{left:16px}
.g .gn{font-weight:600;font-size:13.5px;line-height:1.3}
.g .gm{font-size:11px;color:var(--muted)}
.g.add{border:1.5px dashed var(--line);background:transparent;color:var(--muted);display:flex;justify-content:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{padding:6px 11px;border-radius:99px;background:var(--surface-2);font-size:13px;color:var(--muted)}
.chips.big button{padding:12px 18px;font-size:15px;border-radius:12px}
.chips button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}

/* 시트 */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:440px;max-height:90%;overflow:auto;border-radius:20px 20px 0 0;padding:8px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:4px auto 0}
.field{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);font:inherit}
.alt{display:flex;flex-direction:column;gap:6px}
.altrow{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:center;padding:8px;border-radius:12px;background:var(--surface-2);text-align:left;width:100%}
.filebtn{display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;border-radius:10px;background:var(--surface-2);font-size:13px;cursor:pointer;position:relative}
.filebtn input{position:absolute;opacity:0;width:1px;height:1px}
.stepper{display:inline-flex;align-items:center;background:var(--surface-2);border-radius:10px}
.stepper button{width:44px;height:44px;font-size:20px;font-family:var(--f-num)}
.stepper span{min-width:64px;text-align:center}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs{max-width:440px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tabs button{padding:8px 0 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--faint)}
.tabs button[aria-current="page"]{color:var(--fg)} .tabs button[aria-current="page"] svg{color:var(--accent)}
.ad{max-width:440px;margin:0 auto;text-align:center;font-size:11.5px;color:var(--faint);padding:4px 16px 6px;border-top:1px dashed var(--line)}
.ad b{font-weight:500;color:var(--muted);margin-right:6px}
.toast{position:fixed;left:50%;top:calc(8px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:99px;font-size:13px;z-index:50;max-width:calc(100% - 32px);text-align:center}
@media (max-height:640px){.dial .v{font-size:30px}.btn{padding:12px}h1{font-size:20px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<div id="app" class="app"></div>
<div id="dock" class="dock"></div>
<div id="layer"></div>

<script>
(function(){
'use strict';
// ===== 기구 목록 (첫 설정에서 헬스장 종류를 고르면 미리 켜짐) =====
var GEAR=[
  {id:'lp_pin',n:'레그프레스 (핀 머신)',cat:'하체'},{id:'lp_45',n:'45도 레그프레스',cat:'하체'},{id:'leg_ext',n:'레그 익스텐션',cat:'하체'},{id:'leg_curl',n:'레그 컬',cat:'하체'},{id:'adductor',n:'이너 타이',cat:'하체'},
  {id:'chest_press',n:'시티드 체스트 프레스',cat:'가슴'},{id:'incline',n:'인클라인 프레스',cat:'가슴'},{id:'pec_deck',n:'펙덱 플라이',cat:'가슴'},
  {id:'lat_pd',n:'랫풀다운',cat:'등'},{id:'chin_ast',n:'어시스트 친업',cat:'등'},{id:'cable',n:'케이블 머신',cat:'등'},{id:'tbar',n:'티바 로우',cat:'등'},
  {id:'sh_press',n:'숄더 프레스 머신',cat:'어깨·팔'},{id:'arm_curl',n:'암컬 머신',cat:'어깨·팔'},
  {id:'smith',n:'스미스 머신 · 파워랙',cat:'기타'},{id:'db',n:'덤벨',cat:'기타'},{id:'bench',n:'벤치 (플랫·각도 조절)',cat:'기타'},{id:'back_ext',n:'백 익스텐션',cat:'기타'},{id:'decline',n:'디클라인 싯업 벤치',cat:'기타'},{id:'treadmill',n:'러닝머신',cat:'유산소'},{id:'stairs',n:'계단 (스텝밀)',cat:'유산소'},{id:'bike',n:'실내 자전거',cat:'유산소'}
];
var GMAP={};GEAR.forEach(function(g){GMAP[g.id]=g});
function hasGear(id){return id==='body'||(D&&D.gearOn?D.gearOn.indexOf(id)>=0:!!GMAP[id])}

function cauOf(st){var c=st.caution.slice(),t=st.cautionEtc||'';CAUX.forEach(function(k){if(t.indexOf(k[0])>=0){t=t.split(k[0]).join(' ');if(c.indexOf(k[1])<0)c.push(k[1])}});return c}

function baseSets(st){return st.goal==='건강'?2:3}
var FREQK={1:['A'],2:['A','B'],3:['A','B'],4:['U','L'],5:['U','L','A'],6:['P','PL','LG'],7:['P','PL','LG','R']};
var FREQD={1:'전신 운동 1가지',2:'전신 A·B 번갈아',3:'전신 A·B 번갈아',4:'상체·하체 번갈아',5:'상체·하체·전신 돌아가며',6:'밀기·당기기·하체 돌아가며',7:'밀기·당기기·하체·가벼운 코어'};
function freqSeg(act,cur){return '<div class="seg freq" role="group" aria-label="주 몇 회">'+[1,2,3,4,5,6,7].map(function(v){return '<button data-act="'+act+'" data-v="'+v+'" aria-pressed="'+(cur===v)+'">'+v+'회</button>'}).join('')+'</div><p class="small muted" style="margin-top:6px">주 '+cur+'회 · '+FREQD[cur]+(cur>=5?'<br><span style="color:var(--warn)">초보자는 주 3~4회를 추천해요. 쉬는 날에 근육이 자라요.</span>':'')+'</p>'}
function generate(st){
  var keys=FREQK[st.freq]||['A','B'];
  var days=keys.map(function(k){
    var used=[],items=[];
    TPL[k].slots.forEach(function(c){var got=false;for(var i=0;i<c.length;i++){if(used.indexOf(c[i])<0&&ok(c[i],st)){used.push(c[i]);items.push({id:c[i],sets:k==='R'?2:baseSets(st),edited:false});got=true;break}}
      if(!got)for(var j=0;j<c.length;j++){var e=LIB[c[j]];if(used.indexOf(c[j])<0&&hasGear(e.gear)&&e.lvl!==2&&!items.some(function(x){return LIB[x.id].part===e.part})){used.push(c[j]);items.push({id:c[j],sets:Math.max(1,baseSets(st)-1),edited:false,careful:true});break}}});
    return {key:k,name:TPL[k].name,items:items};
  });
  // 내가 직접 추가한 기구의 운동: 같은 부위 운동이 있는 첫 번째 날에 넣고, 없으면 첫째 날에 넣는다
  Object.keys(LIB).filter(function(x){return LIB[x].custom&&hasGear(LIB[x].gear)}).forEach(function(x){
    var e=LIB[x],hit=false;
    days.forEach(function(d){if(!hit&&d.items.some(function(i){return LIB[i.id].part===e.part})){d.items.push({id:x,sets:baseSets(st),edited:false});hit=true}});
    if(!hit&&days.length)days[0].items.push({id:x,sets:baseSets(st),edited:false});
  });
  return days;
}

function ensureData(){
  if(!Array.isArray(D.gearOn))D.gearOn=[];
  if(!Array.isArray(D.extraGear))D.extraGear=[];
  D.memos=D.memos||{};D.weights=D.weights||{};
  if(!D.chinSplit){
    if(D.gearOn.indexOf('lat_pd')>=0&&D.gearOn.indexOf('chin_ast')<0)D.gearOn.push('chin_ast');
    D.chinSplit=1;
  }
  // 0.1.5에서는 이름만 저장돼 아무 효과가 없었다. 목록에 있는 기구면 켜 주고 나머지는 지운다
  var old=D.extraGear.filter(function(g){return !g.id});
  if(old.length){
    D.extraGear=D.extraGear.filter(function(g){return g.id});
    old.forEach(function(g){var nm=String(g.nm||'');GEAR.forEach(function(x){if((nm.indexOf(x.n)>=0||(x.id==='chin_ast'&&nm.indexOf('친업')>=0))&&D.gearOn.indexOf(x.id)<0)D.gearOn.push(x.id)})});
  }
  if(!Array.isArray(D.places)||!D.places.length){D.places=[{id:'p1',name:'내 헬스장'}];D.placeId='p1'}
  if(!D.places.some(function(p){return p.id===D.placeId}))D.placeId=D.places[0].id;
}

function placeGearN(p){return (p.id===D.placeId?D.gearOn:(p.gearOn||[])).length}
function gearNames(ids){return ids.map(function(id){return GMAP[id]&&GMAP[id].n}).filter(Boolean)}
function switchPlace(id){

// ===== 장면: 운동 중 =====
function startWorkout(){
  var sets=[];
  plan().forEach(function(x){if(!x.n)return;x.warm.forEach(function(w,j){sets.push({id:x.id,e:x.e,kind:'warm',no:j+1,w:w,reps:10})});for(var s=1;s<=x.n;s++)sets.push({id:x.id,e:x.e,kind:'main',no:s,w:x.w,reps:x.e.reps[1],first:x.first,hurt:x.hurt})});
  S.pct=intensity();S.planSec=Math.max(600,minutes(plan())*60);S.sets=sets;S.cur=0;S.start=Date.now();S.setStart=Date.now();S.screen='work';S.askFeel=false;keepAwake(true);announce();render();
}
function curSet(){return S.sets[S.cur]}
function announce(){var c=curSet();if(!c)return;say(c.e.n+', '+(c.kind==='warm'?'워밍업 '+c.no:c.no+'세트')+'. '+(c.e.sec?c.reps+'초':(c.e.step?(c.e.assist?'보조 ':'')+c.w+'킬로 ':'')+c.reps+'회'))}
function groups(){var g=[];S.sets.forEach(function(s){if(g.indexOf(s.id)<0)g.push(s.id)});return g}
// 오늘 예정 시간에서 줄어드는 원 타이머
function setTime(){var c=curSet(),alloc=c?(c.e.sec?c.reps+10:c.reps*4+15):60,el=Math.floor((Date.now()-(S.setStart||S.start))/1000),rem=alloc-el,a=Math.abs(rem),txt=Math.floor(a/60)+':'+String(a%60).padStart(2,'0');
  return {over:rem<0,txt:(rem<0?'+':'')+txt,lab:rem<0?'시간 초과':'세트 남은 시간',off:(326.7*(1-Math.max(0,rem)/alloc)).toFixed(1)}}
function elapsed(){var s=Math.floor((Date.now()-S.start)/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}

// ===== 완료: 기록 저장 + 다음 무게 =====
function finishSession(){
  var done=S.sets.filter(function(s){return s.done});if(!done.length)return null;
  var t=today(),res=[];
  groups().forEach(function(id){
    var ms=done.filter(function(s){return s.id===id&&s.kind==='main'});if(!ms.length)return;
    var e=LIB[id],cur=ms[ms.length-1].w,hit=ms.every(function(s){return s.reps>=e.reps[1]}),hard=ms.some(function(s){return s.feel==='힘듦'}),easy=ms.filter(function(s){return s.feel==='쉬움'}).length>=2,miss=ms.some(function(s){return s.reps<e.reps[0]});
    var W=D.weights[id]||{w:cur,fails:0},next=cur,kind='same';
    if(e.step){
      if(S.pct<100){next=W.w!=null&&D.weights[id]?W.w:cur;kind='light'}
      else if((hit||easy)&&!hard){next=e.assist?Math.max(0,cur-e.step):cur+e.step;W.fails=0;kind='up'}
      else if(miss){W.fails=(W.fails||0)+1;if(W.fails>=2){next=e.assist?cur+roundTo(Math.max(cur,10)*0.1,e.step):roundTo(cur*0.9,e.step);W.fails=0;kind='down'}}
      else W.fails=0;
      W.w=next;D.weights[id]=W;
    }else{if((hit||easy)&&!hard)kind='repsup';D.weights[id]=W}
    res.push({id:id,e:e,cur:cur,next:next,kind:kind});
  });
  D.history.push({date:ymd(),ts:Date.now(),day:t.key,dayName:t.name,place:curPlace().name,mins:Math.max(1,Math.round((Date.now()-S.start)/60000)),pct:S.pct,sets:done.map(function(s){return {id:s.id,kind:s.kind,w:s.w,reps:s.reps,feel:s.feel}})});
  D.nextDay=(D.nextDay+1)%D.prog.length;save();
  return {res:res,sets:done.length,mins:D.history[D.history.length-1].mins,vol:done.reduce(function(a,s){return a+(s.kind==='main'&&s.e.step&&!s.e.assist?s.w*s.reps:0)},0)};
}

  return h+'<div class="bottom"><button class="btn pri" data-act="home">홈으로</button></div></div>';
}

var FULL=['onb','place','check','preview','work','rest','done'];
function render(){
  uid=0;REC=computeRec();
  var full=FULL.indexOf(S.screen)>=0,v;
  app.className='app'+(full?' full':'');
  switch(S.screen){case 'onb':v=vOnb();break;case 'place':v=vPlace();break;case 'check':v=vCheck();break;case 'preview':v=vPreview();break;case 'work':v=vWork();break;case 'rest':v=vRest();break;case 'done':v=vDone();break;case 'prog':v=vProg();break;case 'gear':v=vGear();break;
    default:v=S.tab==='today'?vHome():S.tab==='rec'?vRecords():vMe()}
  var key=S.screen+'|'+S.tab+'|'+S.onb+'|'+S.gearCat+'|'+S.pday+'|'+S.recView,keep=[];
  if(key===render.last)app.querySelectorAll('.scroll').forEach(function(el){keep.push(el.scrollTop)});
  app.innerHTML=v;
  if(keep.length){var els=app.querySelectorAll('.scroll');keep.forEach(function(st,i){if(els[i])els[i].scrollTop=st})}
  render.last=key;
  dock.hidden=full;
  if(!full)dock.innerHTML='<nav class="tabs" aria-label="메뉴">'+tab('today','오늘',I.today)+tab('rec','기록',I.rec)+tab('me','내 정보',I.me)+'</nav><div class="ad" role="complementary" aria-label="광고"><b>AD</b>광고 자리 (테스트 버전) · 운동 중에는 나오지 않아요</div>';
}
function tab(k,label,ico){return '<button data-act="tab" data-k="'+k+'" aria-current="'+(S.tab===k&&S.screen==='home'?'page':'false')+'">'+ico+label+'</button>'}

setInterval(function(){
  if(S.screen==='work'){var ca=document.getElementById('clockall');if(ca)ca.textContent=elapsed();var c=document.getElementById('clock'),wa=document.getElementById('warc'),lb=document.getElementById('clocklab');if(c&&!S.askFeel){var tm=setTime();c.textContent=tm.txt;c.style.color=tm.over?'var(--warn)':'var(--fg)';if(wa){wa.setAttribute('stroke-dashoffset',tm.off);wa.setAttribute('stroke',tm.over?'var(--warn)':'var(--accent)')}if(lb)lb.textContent=tm.lab}}
  if(S.screen==='rest'){
    var left=restLeft(),rt=document.getElementById('rt'),arc=document.getElementById('arc');
    if(rt)rt.textContent=fmtRest();if(arc)arc.setAttribute('stroke-dashoffset',(552.9*(1-left/S.restTotal)).toFixed(1));

  }
},250);

function editItem(i){var it=D.prog[S.pday].items[i];it.edited=true;return it}
document.addEventListener('click',function(ev){
  var t=ev.target.closest('[data-act]');if(!t||t.disabled)return;
  var a=t.dataset.act,i=t.dataset.i==null||t.dataset.i===''?null:+t.dataset.i;
  if(a==='scrim'){if(ev.target===t)closeSheet();return}
  if(a==='tab'){S.tab=t.dataset.k;S.screen='home';render()}
  else if(a==='go'){var s=t.dataset.s;if(s==='prog'){S.progFrom=t.dataset.from||'me';S.pday=0}if(s==='me'){S.tab='me';s='home'}S.screen=s;render()}
  else if(a==='cond'){S.cond[t.dataset.k]=+t.dataset.v;render()}
  else if(a==='time'){S.time=t.dataset.k;render()}
  else if(a==='start'){startWorkout()}
  else if(a==='recv'){S.recView=t.dataset.k;render()}
  else if(a==='gcat'){S.gearCat=t.dataset.v;render()}
  else if(a==='pday'){S.pday=i;render()}
  else if(a==='pedit'){openSheet(sheetEdit(i))}
  else if(a==='mv'){var its=D.prog[S.pday].items,j=i+(+t.dataset.d),tmp=its[i];its[i]=its[j];its[j]=tmp;tmp.edited=true;save();render();openSheet(sheetEdit(j))}
  else if(a==='pset'){var it=editItem(i);it.sets=Math.min(6,Math.max(1,it.sets+(+t.dataset.d)));save();render();openSheet(sheetEdit(i))}
  else if(a==='pdel'){var d0=D.prog[S.pday],nm=LIB[d0.items[i].id].n;d0.items.splice(i,1);d0.changed=true;save();closeSheet();render();toast(nm+'을(를) 뺐어요')}
  else if(a==='pswap'){openSheet(sheetPick('swap',i))}
  else if(a==='padd'){S.addFilter='전체';openSheet(sheetPick('add',null))}
  else if(a==='afilter'){S.addFilter=t.dataset.v;openSheet(sheetPick('add',null))}
  else if(a==='pick'){
    var mode=t.dataset.mode,id=t.dataset.id,pi=t.dataset.i===''?null:+t.dataset.i;
    if(mode==='swap'){var it2=editItem(pi),old=LIB[it2.id].n;it2.id=id;save();closeSheet();render();toast(old+' → '+LIB[id].n)}
    else if(mode==='add'){D.prog[S.pday].items.push({id:id,sets:baseSets(D.settings),edited:true});save();closeSheet();render();toast(LIB[id].n+' 추가')}
    else{var cs=curSet(),from=cs.id,ne=LIB[id];S.sets.forEach(function(s){if(s.id===from&&!s.done){s.id=id;s.e=ne;s.w=WSTART[id]||0;s.reps=ne.reps[1]}});closeSheet();render();toast('오늘만 '+ne.n+'(으)로 바꿨어요')}
  }
  else if(a==='preset'){D.prog=generate(D.settings);save();render();toast('자동 추천으로 되돌렸어요')}
  else if(a==='settings'){S.draft=JSON.parse(JSON.stringify(D.settings));openSheet(sheetSettings())}
  else if(a==='sfreq'){S.draft.freq=+t.dataset.v;openSheet(sheetSettings())}
  else if(a==='smin'){S.draft.minutes=+t.dataset.v;openSheet(sheetSettings())}
  else if(a==='sgoal'){S.draft.goal=t.dataset.v;openSheet(sheetSettings())}
  else if(a==='scau'){var cl=S.draft.caution,v=t.dataset.v;if(v==='기타'){S.draft.etcOn=!S.draft.etcOn;if(!S.draft.etcOn)S.draft.cautionEtc=''}else{var k2=cl.indexOf(v);if(k2>=0)cl.splice(k2,1);else cl.push(v)}openSheet(sheetSettings())}
  else if(a==='sapply'){D.settings=S.draft;D.prog=generate(D.settings);dropOtherProgs();D.nextDay=0;S.pday=0;S.time=D.settings.minutes<=30?'short':D.settings.minutes>=60?'long':'normal';save();closeSheet();render();toast('새 기준으로 다시 추천했어요')}
  else if(a==='voice'){
    if(!('speechSynthesis' in window)){S.voice=false;render();toast('이 브라우저에서는 음성 안내를 쓸 수 없어요');return}
    S.voice=!S.voice;render();
    if(S.voice){say('음성 안내를 켰어요. 세트마다 운동과 무게를 읽어드릴게요.');var vs=[];try{vs=speechSynthesis.getVoices()}catch(e){}
      toast(vs.length&&!vs.some(function(x){return /^ko/i.test(x.lang)})?'이 폰에 한국어 음성이 없어서 안내가 안 들릴 수 있어요':'음성 안내를 켰어요 · 안 들리면 폰 음량을 확인하세요');
      if(S.screen==='work')setTimeout(announce,3500)}
    else{try{speechSynthesis.cancel()}catch(e){}toast('음성 안내를 껐어요')}}
  else if(a==='adj'){var c=curSet(),fd=t.dataset.f,dd=+t.dataset.d;if(fd==='w')c.w=Math.max(c.e.assist?0:c.e.step,c.w+dd*c.e.step);else c.reps=Math.max(1,c.reps+dd*(c.e.sec?5:1));render()}
  else if(a==='done'){S.askFeel=true;render()}
  else if(a==='feel'){
    var c2=curSet();c2.done=true;c2.feel=t.dataset.v;S.askFeel=false;
    if(S.cur>=S.sets.length-1){S.result=finishSession();S.screen='done';keepAwake(false);say('오늘 운동 끝. 수고했어요');render();return}
    var nx=S.sets[S.cur+1];S.cur++;S.said3=false;
    S.restTotal=c2.kind==='warm'?45:(nx.id!==c2.id?120:(c2.e.step?90:60));S.restEnd=Date.now()+S.restTotal*1000;S.screen='rest';render()
  }
  else if(a==='rest'){S.restEnd=Math.max(Date.now()+5000,S.restEnd+(+t.dataset.d)*1000);S.restTotal=Math.max(S.restTotal,restLeft());render()}
  else if(a==='skip'){S.screen='work';S.setStart=Date.now();render();announce()}
  else if(a==='finish'){if(S.sets.some(function(s){return s.done})){S.result=finishSession();S.screen='done'}else S.screen='home';keepAwake(false);render()}
  else if(a==='home'){S.screen='home';S.tab='today';render()}
  else if(a==='talt'){openSheet(sheetPick('today',null))}
  else if(a==='exinfo'){openSheet(sheetEx(t.dataset.id))}
  else if(a==='gearinfo'){S.delGear=null;openSheet(sheetGear(t.dataset.g))}
  else if(a==='savememo'){var inp=document.getElementById('f-memo'),gid=t.dataset.g,val=(inp&&inp.value||'').trim().slice(0,80);if(val)D.memos[gid]=val;else delete D.memos[gid];save();closeSheet();render();toast(val?'세팅 메모를 저장했어요':'메모를 지웠어요')}
  else if(a==='addgear'){S.newGear={tab:'custom',nm:'',part:null,kg:true,err:''};openSheet(sheetAddGear())}
  else if(a==='gtab'){S.newGear.tab=t.dataset.v;openSheet(sheetAddGear())}
  else if(a==='gon'){var gx=t.dataset.g;if(D.gearOn.indexOf(gx)<0)D.gearOn.push(gx);var rf=refreshProg();save();openSheet(sheetAddGear());render();toast(GMAP[gx].n+'을(를) 켰어요'+(rf?' · 프로그램에 반영했어요':' · 직접 고친 프로그램은 그대로예요'))}
  else if(a==='gpart'){S.newGear.part=t.dataset.v;S.newGear.err='';openSheet(sheetAddGear())}
  else if(a==='gkg'){S.newGear.kg=t.dataset.v==='1';openSheet(sheetAddGear())}
  else if(a==='savegear'){
    var ng=S.newGear,nm2=ng.nm.trim().replace(/\s+/g,' ');
    if(!nm2||!ng.part)return;
    var dup=GEAR.some(function(x){return x.n.replace(/\s/g,'')===nm2.replace(/\s/g,'')})||D.extraGear.some(function(x){return !x.gone&&x.nm.replace(/\s/g,'')===nm2.replace(/\s/g,'')});
    if(dup){ng.err='같은 이름의 기구가 이미 있어요. 목록에 있으면 위에서 켜주세요';openSheet(sheetAddGear());return}
    var cid='c'+Date.now().toString(36);
    D.extraGear.push({id:cid,nm:nm2,part:ng.part,kg:!!ng.kg});D.gearOn.push(cid);regCustom();addCustomToProg('x_'+cid);save();closeSheet();S.gearCat='내 기구';render();toast(nm2+'을(를) 추가했어요 · 프로그램에도 넣었어요');
  }
  else if(a==='gdel'){S.delGear=t.dataset.g;openSheet(sheetGear(t.dataset.g))}
  else if(a==='gdelno'){S.delGear=null;openSheet(sheetGear(t.dataset.g))}
  else if(a==='gdelyes'){var dn=GMAP[t.dataset.g]?GMAP[t.dataset.g].n:'기구';delCustom(t.dataset.g);S.delGear=null;save();closeSheet();render();toast(dn+'을(를) 삭제했어요')}
  else if(a==='places'){S.delPlace=null;openSheet(sheetPlaces())}
  else if(a==='prename'){var pi2=document.getElementById('f-pname'),pv=(pi2&&pi2.value||'').trim().slice(0,16);if(!pv)return;if(D.places.some(function(x){return x.id!==D.placeId&&x.name===pv})){toast('같은 이름의 장소가 있어요');return}curPlace().name=pv;save();openSheet(sheetPlaces());render();toast('이름을 바꿨어요')}
  else if(a==='placeuse'){switchPlace(t.dataset.id);S.delPlace=null;openSheet(sheetPlaces());render();toast(curPlace().name+'(으)로 바꿨어요')}
  else if(a==='pdel2'){S.delPlace=t.dataset.id;openSheet(sheetPlaces())}
  else if(a==='pdelno'){S.delPlace=null;openSheet(sheetPlaces())}
  else if(a==='pdelyes'){D.places=D.places.filter(function(x){return x.id!==t.dataset.id||x.id===D.placeId});S.delPlace=null;save();openSheet(sheetPlaces());render();toast('장소를 지웠어요')}
  else if(a==='placego'){S.screen='check';render()}
  else if(a==='placepick'){switchPlace(t.dataset.id);S.screen='check';render();toast(curPlace().name+'에서 운동해요 · '+(D.gearOn.length?'기구 '+D.gearOn.length+'개':'기구 없이'))}
  else if(a==='newplace'){S.np={name:'',gym:null,touched:false};openSheet(sheetNewPlace())}
  else if(a==='npgym'){S.np.gym=t.dataset.v;if(!S.np.touched)S.np.name=PLACE_LABEL[t.dataset.v];openSheet(sheetNewPlace())}
  else if(a==='npsave'){
    var nn=S.np.name.trim(),gy2=GYMS.filter(function(x){return x.k===S.np.gym})[0];if(!nn||!gy2)return;
    if(D.places.some(function(x){return x.name===nn})){toast('같은 이름의 장소가 있어요');return}
    var nid=addPlace(nn,gy2.g);switchPlace(nid);closeSheet();
    if(gy2.k==='custom'){S.gearCat='하체';S.screen='gear';S.tab='me';toast('이 장소에 있는 기구를 골라주세요')}
    else if(S.screen==='place'){S.screen='check';toast(nn+'에서 운동해요 · '+(D.gearOn.length?'기구 '+D.gearOn.length+'개':'기구 없이'))}
    else toast(nn+'을(를) 만들었어요');
    render();
  }
  else if(a==='mplay'){var on=t.dataset.play!=='1';t.dataset.play=on?'1':'0';var hn=t.querySelector('.mhint');if(hn)hn.textContent=on?'■ 눌러서 멈추기':'▶ 눌러서 움직임 보기';var drawAt=function(v){return t.dataset.ex?sceneSvg(t.dataset.ex,v):machSvg(t.dataset.mach,t.dataset.label,v)};if(!on)t.querySelector('.mbox').innerHTML=drawAt(0);if(on&&reduceMotion){t.querySelector('.mbox').innerHTML=drawAt(1);t.dataset.play='0';if(hn)hn.textContent='움직인 뒤 모습'}}
  else if(a==='onbnext'){if(S.onb<7){S.onb++;render()}else{var o=S.od;D.settings=o.settings;D.exp=o.exp;D.gearOn=o.gearOn;var cpn=curPlace(),gyo=GYMS.filter(function(x){return x.k===o.gym})[0];if(gyo&&gyo.k!=='custom'&&cpn.name==='내 헬스장')cpn.name=PLACE_LABEL[gyo.k];dropOtherProgs();D.prog=S.oprog||generate(o.settings);D.onboarded=true;D.nextDay=0;save();S.screen='home';S.tab='today';render();toast('내 플랜을 저장했어요')}}
  else if(a==='onbprev'){S.onb=Math.max(0,S.onb-1);render()}
  else if(a==='ogoal'){S.od.settings.goal=t.dataset.v;render()}
  else if(a==='ofreq'){S.od.settings.freq=+t.dataset.v;render()}
  else if(a==='omin'){S.od.settings.minutes=+t.dataset.v;render()}
  else if(a==='oexp'){S.od.exp=t.dataset.v;render()}
  else if(a==='ocau'){var os=S.od.settings,oc=os.caution,ov=t.dataset.v;if(ov==='없음'){oc.length=0;os.etcOn=false;os.cautionEtc=''}else if(ov==='기타'){os.etcOn=!os.etcOn;if(!os.etcOn)os.cautionEtc=''}else{var oi=oc.indexOf(ov);if(oi>=0)oc.splice(oi,1);else oc.push(ov)}render();var fi=document.querySelector('[data-etc]');if(fi&&ov==='기타')fi.focus()}
  else if(a==='ogym'){var gy=GYMS.filter(function(x){return x.k===t.dataset.v})[0];S.od.gym=gy.k;S.od.gearOn=gy.g.slice();S.onb=6;render()}
  else if(a==='ogear'){var og=S.od.gearOn,oi2=og.indexOf(t.dataset.g);if(oi2>=0)og.splice(oi2,1);else og.push(t.dataset.g);render()}
  else if(a==='data'){S.confirmReset=false;openSheet(sheetData())}
  else if(a==='export'){exportData()}
  else if(a==='reonb'){closeSheet();S.od={settings:JSON.parse(JSON.stringify(D.settings)),exp:D.exp,gearOn:D.gearOn.slice()};S.onb=1;S.screen='onb';render()}
  else if(a==='reset'){S.confirmReset=true;openSheet(sheetData())}
  else if(a==='resetno'){S.confirmReset=false;openSheet(sheetData())}
  else if(a==='resetyes'){try{localStorage.removeItem(KEY)}catch(e){}D=blank();regCustom();D.prog=generate(D.settings);closeSheet();S.od={settings:JSON.parse(JSON.stringify(D.settings)),exp:D.exp,gearOn:D.gearOn.slice()};S.onb=0;S.screen='onb';render();toast('모든 기록을 지웠어요')}
  else if(a==='recex'){S.recEx=t.dataset.k;render()}
  else if(a==='gtoggle'){var gg=t.dataset.g,gi=D.gearOn.indexOf(gg);if(gi>=0)D.gearOn.splice(gi,1);else D.gearOn.push(gg);var rf2=refreshProg();save();closeSheet();render();toast(rf2?'바꿨어요 · 프로그램에 반영했어요':'바꿨어요 · 직접 고친 프로그램은 그대로예요. "추천 기준 바꾸기"에서 새로 추천받으면 반영돼요')}
  else if(a==='close'){closeSheet()}
  else if(a==='toast'){toast(t.dataset.msg)}
});
document.addEventListener('change',function(ev){var inp=ev.target;if(!inp.dataset||!inp.dataset.slot||!inp.files||!inp.files[0])return;
  if(inp.dataset.slot==='import'){var fr=new FileReader();fr.onload=function(){try{var o=JSON.parse(fr.result);if(!o||o.v!==1||!Array.isArray(o.history))throw 0;D=o;ensureData();regCustom();if(!Array.isArray(D.prog))D.prog=generate(D.settings);save();closeSheet();S.screen='home';S.tab='today';render();toast('백업을 불러왔어요 · 운동 '+D.history.length+'회')}catch(e){toast('짐코치 백업 파일이 아니에요')}};fr.readAsText(inp.files[0]);return}
  });
document.addEventListener('input',function(ev){var el=ev.target;
  if(el.dataset&&el.dataset.gname){S.newGear.nm=el.value;S.newGear.err='';var gb=document.getElementById('gsave');if(gb){var rdy=!!(S.newGear.nm.trim()&&S.newGear.part);gb.disabled=!rdy;gb.textContent=rdy?'내 기구로 추가':'이름과 부위를 정해주세요'}var gm=document.getElementById('gmsg');if(gm)gm.textContent='';return}
  if(el.dataset&&el.dataset.pname){S.np.name=el.value;S.np.touched=true;var pb=document.getElementById('npsave');if(pb)pb.disabled=!(S.np.gym&&S.np.name.trim());return}
  if(!el.dataset||!el.dataset.etc)return;var st=el.dataset.etc==='od'?S.od.settings:S.draft;st.cautionEtc=el.value;var m=document.getElementById('etc-rec-'+el.dataset.etc);if(m){m.textContent=etcMsg(st);m.style.color=cauEtcTags(st).length?'var(--info)':'var(--faint)'}});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&layer.innerHTML)closeSheet()});
window.__gcBusy=function(){return S.screen==='work'||S.screen==='rest'};
render();
})();
</script>

<script>
// 새 버전이 깔리면 자동 새로고침 (운동·휴식 중에는 기다렸다가 끝난 뒤에)
if('serviceWorker' in navigator&&location.protocol==='https:'){
  var hadCtrl=!!navigator.serviceWorker.controller,pending=false;
  navigator.serviceWorker.register('sw.js').then(function(r){r.update()}).catch(function(){});
  navigator.serviceWorker.addEventListener('controllerchange',function(){if(!hadCtrl){hadCtrl=true;return}pending=true;tryReload()});
  function tryReload(){if(!pending)return;if(window.__gcBusy&&window.__gcBusy()){setTimeout(tryReload,5000);return}pending=false;location.reload()}
}
</script>
